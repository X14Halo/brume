<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brume Designer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<style>
/* Layout: DCC workspace — tool rail | black void viewport | inspector; variations strip under the view.
   One dark look on purpose: fog is judged against a dark surround. */
:root{
  --frame:#14181d; --panel:#1c2229; --panel-2:#252c35; --well:#0f1317;
  --line:#2c343e; --line-2:#3a444f;
  --fg:#dde3e9; --muted:#8b96a2; --faint:#5c6672;
  --sun:#efb24d; --mist:#a6cbdd; --danger:#e06f5e; --ok:#8fc79b;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--frame);color:var(--fg);font:13px/1.35 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
#app{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 12px;display:grid;grid-template-columns:46px minmax(0,1fr) 336px;grid-template-rows:50px minmax(0,1fr) auto auto;grid-template-areas:"top top top" "rail view insp" "rail tl insp" "rail strip insp";column-gap:8px}
.top{grid-area:top;display:flex;align-items:center;gap:14px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.brand .word{font:italic 400 27px/1 var(--f-display);letter-spacing:.01em}
.seg{display:flex;gap:2px;background:var(--well);border:1px solid var(--line);border-radius:5px;padding:2px;flex:none}
.seg button{background:transparent;border:0;border-radius:3px;padding:4px 11px;font:500 12px var(--f-ui);color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--fg)}
.seg button:disabled{color:var(--faint);cursor:default}
.seg button .soon{font:500 9.5px var(--f-mono);color:var(--faint);margin-left:4px}
#qFinal[aria-pressed=true]{background:var(--sun);color:#1b1408}
.name-in{background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 7px;font:500 14px var(--f-ui);width:min(260px,30vw);min-width:0}
.name-in:hover,.name-in:focus{border-color:var(--line-2);background:var(--well)}
.top-r{margin-left:auto;display:flex;gap:8px;flex:none;align-items:center}
.tbtn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:5px 11px;font:500 12px var(--f-ui)}
.tbtn.accent{background:var(--sun);border-color:var(--sun);color:#1b1408}
.rail{grid-area:rail;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.tool{position:relative;width:44px;height:42px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.tool:hover{background:var(--panel);color:var(--fg)}
.tool[aria-pressed=true]{background:var(--panel-2);border-color:var(--line-2);color:var(--sun)}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool .k{position:absolute;right:4px;bottom:2px;font:500 9px var(--f-mono);color:var(--faint)}
.rail .sep{height:1px;background:var(--line);margin:3px 6px;flex:none}
.view{grid-area:view;position:relative;background:#000;border-radius:6px;overflow:hidden;min-height:0;border:1px solid var(--line)}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#glc{pointer-events:none}
#ov{touch-action:none;cursor:grab}
.hint{position:absolute;left:10px;top:10px;max-width:min(520px,calc(100% - 20px));display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:rgba(14,17,21,.78);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.06);border-radius:5px;padding:6px 10px;font-size:12px;color:var(--muted);pointer-events:none}
.hint b{color:var(--fg);font-weight:600}
.hud{position:absolute;left:10px;bottom:10px;font:11px var(--f-mono);color:rgba(230,234,238,.75);background:rgba(14,17,21,.6);border-radius:4px;padding:3px 7px;font-variant-numeric:tabular-nums;pointer-events:none}
.tl{grid-area:tl;display:flex;align-items:center;gap:10px;padding:8px 2px 0;min-width:0;flex-wrap:wrap}
.tl .vbtn{background:var(--panel-2)}
.tlinfo{display:flex;flex-direction:column;gap:1px;min-width:118px;font-variant-numeric:tabular-nums}
.tlinfo b{font:600 12px var(--f-mono);color:var(--fg)} .tlinfo span{font:11px var(--f-mono);color:var(--faint)}
.track{position:relative;flex:1 1 220px;min-width:160px;height:26px;border-radius:4px;background:var(--well);border:1px solid var(--line);cursor:pointer;touch-action:none}
.track .pre{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.03) 5px 10px);border-radius:4px 0 0 4px}
.track .rng{position:absolute;top:4px;bottom:4px;background:rgba(166,203,221,.22);border:1px solid rgba(166,203,221,.55);border-radius:3px}
.track .h{position:absolute;top:-3px;bottom:-3px;width:8px;margin-left:-4px;background:var(--mist);border-radius:2px;cursor:ew-resize}
.track .h.out{background:var(--mist)} .track .ph{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--sun);pointer-events:none}
.tlnum{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.tlnum input{width:62px;background:var(--well);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font:12px var(--f-mono);color:var(--fg)}
.tlspd{font-size:11.5px;color:var(--muted);white-space:nowrap}
.vbtn{display:flex;align-items:center;gap:6px;background:rgba(14,17,21,.82);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font:500 12px var(--f-ui);color:var(--fg);white-space:nowrap}
.vbtn svg{width:13px;height:13px;fill:currentColor}
.vbtn[aria-pressed=true]{border-color:var(--sun);color:var(--sun)}
.simbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.05);pointer-events:none}
.simbar i{display:block;height:100%;width:0;background:var(--mist);transition:width .12s}
.simbar i.fin{background:var(--sun)}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#1d232b 0%,#07090b 75%);z-index:4}
.loader .card{width:min(380px,80%);display:flex;flex-direction:column;gap:10px}
.loader .t{font:italic 28px var(--f-display)}
.loader .s{font:12px var(--f-mono);color:var(--muted);min-height:1.4em}
.loader .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mist),var(--sun));transition:width .2s}
.loader.err .s{color:var(--danger);white-space:pre-wrap;max-height:40vh;overflow:auto}
.toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:6px 12px;font-size:12px;z-index:5;white-space:nowrap;display:flex;gap:10px;align-items:center}
.toast button{background:none;border:0;color:var(--sun);font-weight:600;padding:0}
.drop{position:absolute;inset:10px;border:2px dashed var(--mist);border-radius:8px;display:grid;place-items:center;background:rgba(8,10,12,.75);z-index:3;font:500 15px var(--f-ui);pointer-events:none}
.strip{grid-area:strip;display:flex;gap:8px;align-items:stretch;padding-top:8px;min-width:0;overflow-x:auto;scrollbar-width:thin}
.strip .lab{flex:none;display:flex;flex-direction:column;justify-content:center;gap:4px;width:88px;font-size:11.5px;color:var(--muted);line-height:1.35}
.strip .lab b{color:var(--fg);font:600 10.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase}
.var{flex:none;position:relative;width:176px;aspect-ratio:16/9;max-width:100%;border-radius:5px;border:1px solid var(--line);background:#000;padding:0;overflow:hidden}
.var canvas{width:100%;height:100%;display:block}
.var:hover{border-color:var(--mist)}
.var span{position:absolute;left:6px;bottom:4px;font:500 10px var(--f-mono);color:rgba(220,226,232,.7)}
.var.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:sh 1.2s linear infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.insp{grid-area:insp;overflow-y:auto;overflow-x:hidden;min-height:0;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;padding-bottom:4px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 12px}
.sec>summary{list-style:none;cursor:pointer;padding:10px 0;font:600 10.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg) translateY(-2px)}
.sec[open]>summary::after{transform:rotate(-135deg)}
.body{display:flex;flex-direction:column;gap:6px;padding-bottom:12px}
.sub-h{font:500 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:100px minmax(0,1fr) 64px;align-items:center;gap:8px;min-height:24px}
.row label{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{font:11px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.wide{grid-template-columns:100px minmax(0,1fr)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--mist) var(--p),var(--line-2) var(--p))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--mist) var(--p),var(--line-2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);margin-top:-4.5px;border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--fg);border:2px solid var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 11.5px var(--f-ui);padding:3px 9px;border-radius:3px;border:1px solid var(--line-2);background:transparent;color:var(--muted)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed=true]{color:#10161b;background:var(--mist);border-color:var(--mist)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border-radius:5px;border:1px solid var(--line);background:var(--well);color:var(--muted);font-size:11px;line-height:1.15;text-align:center}
.tile svg{width:30px;height:22px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tile:hover{color:var(--fg);border-color:var(--line-2)}
.tile[aria-pressed=true]{color:var(--fg);border-color:var(--mist);box-shadow:inset 0 0 0 1px var(--mist)}
.note{font-size:11.5px;color:var(--faint);line-height:1.45}
.cur{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.cur svg,.card svg{width:36px;height:28px;fill:none;stroke:var(--mist);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.cur b{display:block;font:600 13px var(--f-ui);color:var(--fg)} .cur span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.cur em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:4px}
.libtabs{display:flex;flex-wrap:wrap;gap:4px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.card{display:grid;grid-template-columns:38px minmax(0,1fr);gap:9px;text-align:left;align-items:start;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--fg)}
.card:hover{border-color:var(--mist)} .card[aria-current=true]{border-color:var(--sun)}
.card b{display:block;font:600 13px var(--f-ui)} .card span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.card em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:5px;line-height:1.35} .card em i{font-style:normal;color:var(--mist)}
.libcat{font:600 10.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.colr{display:flex;align-items:center;gap:8px} .colr input[type=color]{width:34px;height:22px;padding:0;border:1px solid var(--line-2);border-radius:4px;background:none}
.note b{color:var(--muted);font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:4px 10px;font:500 12px var(--f-ui)}
.btn.prim{background:var(--mist);border-color:var(--mist);color:#0e1418}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dims label{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.dims input{background:var(--well);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:12px var(--f-mono);width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.shelf .it{position:relative;border:1px solid var(--line);border-radius:5px;background:#000;padding:0;overflow:hidden;aspect-ratio:16/9;text-align:left}
.shelf .it img{width:100%;height:100%;object-fit:cover;display:block}
.shelf .it span{position:absolute;left:5px;bottom:3px;right:20px;font:500 10.5px var(--f-ui);color:#dde3e9;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf .it i{position:absolute;right:3px;top:2px;font:normal 13px var(--f-ui);color:#aab;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.4)}
.empty{color:var(--muted);font-size:12px;line-height:1.5}
.kbd{font:500 10.5px var(--f-mono);background:var(--panel-2);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;color:var(--fg)}
.modal{position:fixed;inset:0;background:rgba(6,8,10,.66);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mcard{width:min(760px,100%);max-height:calc(100% - 48px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font:italic 400 24px var(--f-display)}
.mbody{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbody p{margin:0;max-width:68ch;color:var(--muted);line-height:1.55}
.mbody p b{color:var(--fg);font-weight:600}
pre.code{margin:0;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:12px;font:11.5px/1.5 var(--f-mono);color:#c9d3dc;overflow:auto;max-height:260px;white-space:pre}
.x{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;display:flex;flex-direction:column;gap:8px;padding-block:6px 16px}
  .top{flex-wrap:wrap;gap:8px 10px}
  .rail{flex-direction:row;overflow-x:auto;padding:0}
  .rail .sep{width:1px;height:auto;margin:6px 2px}
  .view{height:56vh;min-height:300px;flex:none}
  .insp{overflow:visible}
}
@media (prefers-reduced-motion:reduce){.simbar i,.loader .bar i{transition:none}.var.busy::after{animation:none}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand"><span class="word">Brume</span></div>
    <div class="seg" role="group" aria-label="Workspace">
      <button aria-pressed="true">Designer</button>
      <button disabled title="Next: place designed fog into shots against the utility passes">Shot<span class="soon">next</span></button>
    </div>
    <input class="name-in" id="assetName" aria-label="Asset name" value="Fog bank">
    <div class="top-r">
      <div class="seg" role="group" aria-label="Render quality">
        <button id="qDraft" aria-pressed="true" title="Fast interactive preview (G)">Draft</button>
        <button id="qFinal" aria-pressed="false" title="Full resolution, every detail octave, detailed self-shadowing (G)">Final</button>
      </div>
      <button class="tbtn accent" id="exportBtn">Export</button>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Tools"></nav>
  <section class="view" id="view">
    <canvas id="glc"></canvas>
    <canvas id="ov" aria-label="Designer viewport"></canvas>
    <div class="hint" id="hint"></div>
    <div class="hud" id="hud">starting</div>
    <div class="simbar"><i id="simBar"></i></div>
    <div class="drop" id="drop" hidden>Drop a Brume recipe (.json) to load it</div>
    <div class="loader" id="loader"><div class="card"><div class="t">Brume Designer</div><div class="s" id="loadMsg">Starting the GPU</div><div class="bar"><i id="loadBar"></i></div></div></div>
    <div class="toast" id="toast" hidden></div>
  </section>
  <div class="tl" id="tl"></div>
  <section class="strip" id="strip" hidden></section>
  <aside class="insp" id="insp">
    <details class="sec" open id="brushSec" hidden><summary>Brush</summary><div class="body" id="brushBody"></div></details>
    <details class="sec" open><summary>Start from</summary><div class="body" id="startBody"></div></details>
    <details class="sec" open><summary>Size &amp; scale</summary><div class="body" id="sizeBody"></div></details>
    <details class="sec" open id="formSec" hidden><summary>Formation</summary><div class="body" id="formBody"></div></details>
    <details class="sec" open id="emitSec"><summary>Emitter</summary><div class="body" id="emitBody"></div></details>
    <details class="sec" open><summary>Simulate</summary><div class="body" id="simBody"></div></details>
    <details class="sec" open><summary>Detail</summary><div class="body" id="detBody"></div></details>
    <details class="sec" open><summary>Detail level</summary><div class="body" id="lodBody"></div></details>
    <details class="sec"><summary>Density</summary><div class="body" id="denBody"></div></details>
    <details class="sec"><summary>Light &amp; view</summary><div class="body" id="lightBody"></div></details>
    <details class="sec"><summary>Shelf</summary><div class="body" id="shelfBody"></div></details>
  </aside>
</div>
<div class="modal" id="libModal" hidden><div class="mcard" role="dialog" aria-modal="true" aria-labelledby="libTitle" style="width:min(1040px,100%)">
  <div class="mhead"><h2 id="libTitle">Library</h2><div class="libtabs" id="libTabs"></div><button class="x" id="libClose" aria-label="Close">×</button></div>
  <div class="mbody" id="libBody"></div></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="modal" id="modal" hidden><div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mhead"><h2 id="mTitle">Export</h2><button class="x" id="mClose" aria-label="Close">×</button></div>
  <div class="mbody" id="mBody"></div></div></div>
<script>
/* =====================================================================
   SHADERS — every volume pass renders one z-slice of a 3D texture at a time
   ===================================================================== */
const HEAD=`#version 300 es
precision highp float; precision highp int; precision highp sampler2D; precision highp sampler3D;
`;
const VS_FS=`#version 300 es
layout(location=0) in vec2 aPos; void main(){ gl_Position=vec4(aPos,0.,1.); }`;

/* tileable noise: 0 shape (perlin-worley, worley fbm, perlin fbm), 1 detail (worley 4/8/16 + perlin fbm), 2 curl field */
const NOISE_GLSL=`
vec3 h33(vec3 p){ uvec3 q=uvec3(ivec3(p)+4096)*uvec3(1597334673u,3812015801u,2798796415u); q=(q.x^q.y^q.z)*uvec3(1597334673u,3812015801u,2798796415u); return vec3(q)*(1.0/4294967295.0); }
float gd(vec3 i,vec3 c,vec3 f,float per){ vec3 g=h33(mod(i+c,per))*2.0-1.0; return dot(normalize(g+1e-5),f-c); }
float perlin(vec3 p,float per){ vec3 i=floor(p),f=fract(p); vec3 u=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(mix(gd(i,vec3(0,0,0),f,per),gd(i,vec3(1,0,0),f,per),u.x),mix(gd(i,vec3(0,1,0),f,per),gd(i,vec3(1,1,0),f,per),u.x),u.y),
             mix(mix(gd(i,vec3(0,0,1),f,per),gd(i,vec3(1,0,1),f,per),u.x),mix(gd(i,vec3(0,1,1),f,per),gd(i,vec3(1,1,1),f,per),u.x),u.y),u.z); }
float worley(vec3 p,float per){ vec3 i=floor(p),f=fract(p); float md=1.0;
  for(int z=-1;z<=1;z++) for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){ vec3 c=vec3(x,y,z); vec3 d=c+h33(mod(i+c,per))-f; md=min(md,dot(d,d)); }
  return 1.0-sqrt(md); }
float pfbm(vec3 p,float f0,int oct){ float a=0.5,s=0.,t=0.,f=f0; for(int k=0;k<5;k++){ if(k>=oct) break; s+=perlin(p*f,f)*a; t+=a; a*=0.5; f*=2.; } return clamp(s/t*1.15+0.5,0.,1.); }
float wfbm(vec3 p,float f0){ return worley(p*f0,f0)*0.625+worley(p*f0*2.,f0*2.)*0.25+worley(p*f0*4.,f0*4.)*0.125; }
`;
const FS_NOISE=HEAD+NOISE_GLSL+`
uniform float uZ; uniform float uN; uniform int uMode; out vec4 o;
vec3 pot(vec3 p){ return vec3(perlin(p*3.,3.)+0.5*perlin(p*6.+11.,6.), perlin(p*3.+vec3(31.,7.,19.),3.)+0.5*perlin(p*6.+vec3(5.,43.,2.),6.), perlin(p*3.+vec3(13.,57.,29.),3.)+0.5*perlin(p*6.+vec3(23.,3.,61.),6.)); }

  vec3 p=vec3(gl_FragCoord.xy/uN,uZ);
  if(uMode==1){ o=vec4(worley(p*4.,4.),worley(p*8.,8.),worley(p*16.,16.),pfbm(p,4.,4)); return; }
  if(uMode==2){ float e=0.5/uN; // curl of a tileable vector potential: divergence-free swirls
    vec3 dx=vec3(e,0,0), dy=vec3(0,e,0), dz=vec3(0,0,e);
    vec3 px0=pot(p-dx), px1=pot(p+dx), py0=pot(p-dy), py1=pot(p+dy), pz0=pot(p-dz), pz1=pot(p+dz);
    vec3 c=vec3((py1.z-py0.z)-(pz1.y-pz0.y),(pz1.x-pz0.x)-(px1.z-px0.z),(px1.y-px0.y)-(py1.x-py0.x))/(2.*e);

/* voxel helpers shared by the volume passes */
const VOX_GLSL=`
uniform vec3 uDims, uSize, uLo; uniform float uZ, uHgt;    // the box: lower corner and size in world metres; uHgt is the asset's design height
vec3 vU(){ return vec3(gl_FragCoord.xy/uDims.xy,uZ); }

/* stand-in ground: 0 none, 1 flat, 2 slope, 3 peak, 4 valley, 5 bowl, 6 street, 7 pool, 8 lake (mirrored in JS: terrHJ) */
const TERR_GLSL=`
uniform int uGround; uniform vec4 uGP; uniform vec4 uWater;   // uGP: relief, feature size, street half-width, seed · uWater: centre xz, radius, on
float thash(float n){ return fract(sin(n*127.1+311.7)*43758.5453); }
float tn(vec2 p){ return sin(p.x*1.7+sin(p.y*1.3))*0.5+sin(p.y*2.1+sin(p.x*0.9)*1.4)*0.35+sin((p.x+p.y)*3.7)*0.15; }
float terrH(vec2 q){
  if(uGround<2||uGround>6) return 0.;
  float Hg=uGP.x, L=uGP.y; vec2 s=q/L; float n=tn(s*4.+uGP.w)*0.06+tn(s*9.+uGP.w*1.7)*0.025;
  if(uGround==2) return Hg*(smoothstep(-0.6,0.6,s.x)+n);
  if(uGround==3){ float r2=dot(s,s); return Hg*(exp(-r2/0.06)+n*0.7); }
  if(uGround==4) return Hg*((1.-exp(-s.y*s.y/0.045))*(0.8+0.2*sin(s.x*5.+uGP.w))+n);
  if(uGround==5){ float r2=dot(s,s); return Hg*((1.-exp(-r2/0.06))+n); }
  float w=uGP.z; if(abs(q.y)<w) return 0.; float lot=w*1.8; if(abs(q.y)>w+lot*1.6) return 0.;
  float c=floor(q.x/lot); if(fract(q.x/lot)<0.1) return 0.; return Hg*(0.45+0.55*thash(c*2.+(q.y>0.?1.:0.)));

float isWater(vec2 q){ if(uWater.w<0.5) return 0.; float r=length(q-uWater.xy); float rr=uWater.z*(1.+0.05*tn(q/uWater.z*3.)); return 1.-smoothstep(rr-uWater.z*0.02,rr,r); }

vec3 terrN(vec2 q){ vec2 g=terrG(q); return normalize(vec3(-g.x,1.,-g.y)); }

function houdiniPy(name,meta){ const seq=!!meta.frames; return `# Brume Designer -> Houdini volume${seq?' sequence':''}
# Python SOP. Unzip ${slug(name)}_brume.zip, then point FOLDER at it. Append a Convert VDB SOP for a VDB.
import hou, json, os
import numpy as np
FOLDER = hou.expandString("$HIP/brume/${slug(name)}")

nx, ny, nz = meta["resolution"]
${seq?`frames = meta["frames"]                          # the frames that were baked (every Nth if you chose to skip)
f = int(round(hou.frame()))
f = min(frames, key=lambda k: abs(k - f))         # hold the nearest baked frame outside the range or between skipped ones
path = os.path.join(FOLDER, "density.%04d.f16" % f)`:`path = os.path.join(FOLDER, "density.f16")`}
data = np.fromfile(path, dtype="<f2").astype(np.float32)
geo = hou.pwd().geometry()
bmin, bmax = meta["bbox_min"], meta["bbox_max"]

vol.setAllVoxelsFromString(data.tobytes())   # x varies fastest, then y, then z
geo.addAttrib(hou.attribType.Prim, "name", "")
vol.setAttribValue("name", "density")
# density is extinction per metre: render with density scale 1, scattering ~0.98, droplet phase g ~${mieParams(meta.droplet_um)[0].toFixed(2)}
`; }

    <div style="display:flex;align-items:center;gap:10px"><span style="font:500 11px var(--f-mono);color:var(--faint)">Houdini · Python SOP</span><button class="btn" id="exCopy" style="margin-left:auto">Copy</button></div><pre class="code" id="exPy"></pre>`;
  const chipRow=(id,opts,get,set)=>{ const c=$('#'+id); c.innerHTML=''; for(const [v,t,title] of opts){ const b=document.createElement('button'); b.className='chip'; b.textContent=t; if(title) b.title=title; b.setAttribute('aria-pressed',get()===v); b.onclick=()=>{ set(v); draw(); }; c.appendChild(b); } };
  const draw=()=>{ const tm=timing(REC); const N=Math.round(exportN*rk); const d=dimsFor(DS,N); const mb=(d[0]*d[1]*d[2]*2)/1048576; const nF=exportMode==='seq'?Math.ceil(tm.frames/exportEvery):1;
    chipRow('exMode',[['frame','This frame','The moment under the playhead'],['seq',`Sequence · ${tm.frames} frames`,'Every frame from In to Out, retimed']],()=>exportMode,v=>exportMode=v);
    $('#exEveryRow').hidden=exportMode!=='seq'; chipRow('exEvery',[[1,'frame'],[2,'2nd'],[4,'4th']],()=>exportEvery,v=>exportEvery=v);
    chipRow('exRes',LODS.map(L=>[L.exp,L.label,L.exp+' voxels along the fog']),()=>exportN,v=>exportN=v);
    const tot=mb*nF; $('#exInfo').textContent=`${d.join(' × ')} voxels · ${fmLen(Math.max(...DS)/N)} each · ${mb.toFixed(1)} MB a frame`+(nF>1?` · ${nF} frames · ${tot<1024?tot.toFixed(0)+' MB':(tot/1024).toFixed(1)+' GB'}`:'')+(tot>1500?' · large: try Soft, or every 2nd frame':'');
    const py=houdiniPy(REC.name,{droplet_um:REC.den.drop,frames:exportMode==='seq'?[1]:null}); $('#exPy').textContent=py; };
  draw();
  $('#exCopy').onclick=async()=>{ const py=$('#exPy').textContent; try{ await navigator.clipboard.writeText(py); $('#exCopy').textContent='Copied'; }catch(_){ const r=document.createRange(); r.selectNodeContents($('#exPy')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $('#exCopy').textContent='Selected · Ctrl C'; } };
  $('#exGo').onclick=doExport; $('#modal').hidden=false; $('#mClose').focus(); }
/* step the main simulation to a time (starting over if it is earlier than where the sim is) */
async function simTo(t,prog){ if(t<MAIN.sim.t-1e-6) simReset(MAIN,REC,t); else simExtend(MAIN,t); let k=0; while(MAIN.sim.step<MAIN.sim.steps){ simStep(MAIN,REC); if(++k%10===0){ prog&&prog(); await yieldUI(); } } }
async function doExport(){ const st=$('#exStatus'); const go=$('#exGo'); go.disabled=true; if(UI.playing) togglePlay();
  const name=slug(REC.name); const enc=new TextEncoder(); const N=Math.round(exportN*roomK(REC)); const tm=timing(REC);
  try{ if(!window.fflate) throw new Error('The zip library did not load; check the connection and try again.');
    exporting=true; const parts=[]; let zerr=null; const zip=new fflate.Zip((err,dat)=>{ if(err) zerr=err; else parts.push(dat); });
    const addFile=(nm,u8,store)=>{ const z=store?new fflate.ZipPassThrough(nm):new fflate.ZipDeflate(nm,{level:6}); zip.add(z); z.push(u8,true); };
    const frs=[]; if(exportMode==='seq'){ for(let f=tm.start;f<=tm.start+tm.frames-1;f+=exportEvery) frs.push(f); if(frs[frs.length-1]!==tm.start+tm.frames-1) frs.push(tm.start+tm.frames-1); }
    let dims=null, mx=0;
    const bakeAt=async(t,label,file)=>{ await simTo(t,()=>{ st.textContent=label+' · simulating'; }); const b=await bake(MAIN,REC,N,p=>{ st.textContent=label+' · baking '+Math.round(p*100)+'%'; });
      const h=new Uint16Array(b.data.length); for(let i=0;i<b.data.length;i++){ h[i]=f32to16(b.data[i]); if(b.data[i]>mx) mx=b.data[i]; } dims=b.dims; addFile(name+'/'+file,new Uint8Array(h.buffer),true); await yieldUI(); };
    if(frs.length){ for(let i=0;i<frs.length;i++) await bakeAt(frameT(tm,frs[i]),`Frame ${frs[i]} (${i+1}/${frs.length})`,`density.${String(frs[i]).padStart(4,'0')}.f16`); }
    else await bakeAt(viewTime(REC),'This frame','density.f16');
    if(zerr) throw zerr;
    const meta={format:'brume-designer-volume',version:2,name:REC.name,resolution:dims,order:'x fastest, then y, then z',dtype:'float16 little-endian',units:'metres',bbox_min:REC.dom[0],bbox_max:REC.dom[1],
      voxel_size_m:domSize(REC).map((v,i)=>v/dims[i]),density:'extinction per metre',max_density:mx,droplet_um:REC.den.drop,sits_on_ground:REC.floor,
      ...(frs.length?{frames:frs,fps:tm.fps,frame_start:tm.start,frame_end:tm.start+tm.frames-1,sim_in_s:tm.inT,sim_out_s:tm.outT,speed:tm.speed}:{sim_time_s:viewTime(REC)})};
    addFile(name+'/meta.json',enc.encode(JSON.stringify(meta,null,1))); addFile(name+'/recipe.brume.json',enc.encode(JSON.stringify({brume:'designer-recipe',look:LOOK,...REC}))); addFile(name+'/load_in_houdini.py',enc.encode(houdiniPy(REC.name,meta)));
    zip.end(); if(zerr) throw zerr; exporting=false; dirty.sim=true;
    st.textContent=''; const ok=await offerFile(name+'_brume.zip',new Blob(parts,{type:'application/zip'}),'application/zip'); st.textContent=ok?`Saved ${name}_brume.zip · ${frs.length?frs.length+' frames · ':''}${dims.join(' × ')} voxels`:'Not saved.'; }
  catch(e){ console.error(e); st.textContent='Export failed: '+e.message; }
  exporting=false; dirty.sim=true; go.disabled=false; }
function closeModal(){ $('#modal').hidden=true; }
$('#exportBtn').onclick=openExport; $('#mClose').onclick=closeModal; $('#modal').addEventListener('click',ev=>{ if(ev.target.id==='modal') closeModal(); });

/* ---------------- status ---------------- */
let lastDomS=''; function updateHud(vw,vh,fin,target){ const ds=JSON.stringify(REC.dom); if(ds!==lastDomS){ lastDomS=ds; lodRefresh(); } const S=MAIN.sim; const simDone=S.step>=S.steps; const p=S.steps?S.step/S.steps:1;
  const bar=$('#simBar'); bar.style.width=(simDone?Math.min(1,frames/target):p)*100+'%'; bar.classList.toggle('fin',fin);
  const st=brushing?'sculpting':!simDone?'simulating '+Math.round(p*100)+'%':UI.playing?'playing':frames>=target?(fin?'final':'refined'):fin?'final '+frames+'/'+target:'refining';
  $('#hud').textContent=`${MAIN.dims?MAIN.dims.join('×'):''} voxels · ${fin?'final':'draft'} ${vw}×${vh} · ${ftAvg.toFixed(0)} ms · ${st}`; }
function toast(msg){ const t=$('#toast'); t.innerHTML=''; t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2400); }
function toastUndo(msg){ const t=$('#toast'); t.innerHTML=''; const s=document.createElement('span'); s.textContent=msg; const b=document.createElement('button'); b.textContent='Undo'; b.onclick=()=>{ undo(); t.hidden=true; }; t.append(s,b); t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,4000); }
function showLoader(msg,p){ const l=$('#loader'); l.hidden=false; l.classList.remove('err'); $('#loadMsg').textContent=msg; if(p!=null) $('#loadBar').style.width=(p*100).toFixed(1)+'%'; }
function hideLoader(){ $('#loader').hidden=true; }
function fail(msg){ const l=$('#loader'); l.hidden=false; l.classList.add('err'); $('#loadMsg').textContent=msg; ready=false; }

/* ---------------- boot ---------------- */
async function boot(){
  const saved=store.get('brume.designer.current'); if(saved&&saved.size&&saved.sim&&TEMPLATES[saved.template]){ const r=makeRecipe(saved.template,saved.cls||'mid',saved.seed); REC=migrateRecipe({...r,...saved,v:saved.v||1,sim:{...r.sim,...saved.sim},det:{...r.det,...saved.det},den:{...r.den,...saved.den}}); }
  const lk=store.get('brume.designer.look'); if(lk) Object.assign(LOOK,lk); else applyLight('backlit');
  try{ if(window.__BRUME_TEST){ Object.assign(LOOK,window.__BRUME_TEST.look||{}); if(window.__BRUME_TEST.rec) REC=migrateRecipe(window.__BRUME_TEST.rec); } }catch(_){}
  $('#assetName').value=REC.name; UI.brushR=Math.max(...REC.size)*0.12;
  buildRail(); buildHint(); buildPanels(); buildTimeline();
  if(!initGL()) return;
  const t0=performance.now();
  while(true){ const done=Object.values(PR).filter(progDone).length, n=Object.keys(PR).length; showLoader(`Compiling shaders ${done}/${n} · ${((performance.now()-t0)/1000).toFixed(1)} s`,0.02+0.16*done/n); if(done===n) break; await new Promise(r=>setTimeout(r,60)); }
  try{ for(const p of Object.values(PR)) progCheck(p); }catch(e){ fail(e.message); return; }
  await buildNoise();
  showLoader('Shaping the first asset',0.6); await yieldUI();
  resize(); new ResizeObserver(()=>resize()).observe($('#view'));
  frameAll(); pushUndo(); hideLoader(); ready=true; requestAnimationFrame(frame);
}
glc.addEventListener('webglcontextlost',ev=>{ ev.preventDefault(); ready=false; showLoader('The GPU reset. Reload the page to continue.',0); });
boot();
</script>
