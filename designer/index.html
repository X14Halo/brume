<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brume Designer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<style>
/* Layout: DCC workspace — tool rail | black void viewport | inspector; variations strip under the view.
   One dark look on purpose: fog is judged against a dark surround. */
:root{
  --frame:#14181d; --panel:#1c2229; --panel-2:#252c35; --well:#0f1317;
  --line:#2c343e; --line-2:#3a444f;
  --fg:#dde3e9; --muted:#8b96a2; --faint:#5c6672;
  --sun:#efb24d; --mist:#a6cbdd; --danger:#e06f5e; --ok:#8fc79b;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--frame);color:var(--fg);font:13px/1.35 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
#app{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 12px;display:grid;grid-template-columns:46px minmax(0,1fr) 336px;grid-template-rows:50px minmax(0,1fr) auto auto;grid-template-areas:"top top top" "rail view insp" "rail tl insp" "rail strip insp";column-gap:8px}
.top{grid-area:top;display:flex;align-items:center;gap:14px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.brand .word{font:italic 400 27px/1 var(--f-display);letter-spacing:.01em}
.seg{display:flex;gap:2px;background:var(--well);border:1px solid var(--line);border-radius:5px;padding:2px;flex:none}
.seg button{background:transparent;border:0;border-radius:3px;padding:4px 11px;font:500 12px var(--f-ui);color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--fg)}
.seg button:disabled{color:var(--faint);cursor:default}
.seg button .soon{font:500 9.5px var(--f-mono);color:var(--faint);margin-left:4px}
#vtop{position:absolute;right:10px;top:10px;z-index:3;display:flex;gap:8px;align-items:center}
#vtop .seg{background:rgba(14,17,21,.78);backdrop-filter:blur(6px)}
#undoSeg button{padding:4px 9px;display:flex;align-items:center}
#undoSeg svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#modeSeg button{padding:5px 16px;font-weight:600}
#modeSeg button[aria-pressed=true]{background:#e6eaee;color:#14171b}
.modebadge{position:absolute;right:10px;bottom:10px;font:500 11px var(--f-mono);color:rgba(230,234,238,.7);background:rgba(14,17,21,.6);border-radius:4px;padding:3px 8px;pointer-events:none}
body[data-mode=anim] .shape-only, body:not([data-mode=anim]) .anim-only{display:none!important}
body[data-ws=shot] .ws-designer, body:not([data-ws=shot]) .ws-shot{display:none!important}
.lookrow{display:grid;grid-template-columns:minmax(0,1fr) 112px 28px;gap:6px;align-items:center;margin:4px 0}
.lookrow .lksel{display:grid;grid-template-columns:12px auto minmax(0,1fr);gap:7px;align-items:center;text-align:left;background:var(--well);border:1px solid var(--line);border-radius:5px;padding:5px 8px;color:var(--fg);font:12px var(--f-ui);min-width:0}
.lookrow .lksel i{width:10px;height:10px;border-radius:50%}
.lookrow .lksel span{color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lookrow.on .lksel{border-color:var(--sun);box-shadow:0 0 0 1px var(--sun) inset}
.lookrow select{min-width:0;background:var(--well);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px;font:12px var(--f-ui)}
#cleanBtn[aria-pressed=true],#regionBtn[aria-pressed=true],#refBtn[aria-pressed=true],#abBtn[aria-pressed=true],#pbBtn[aria-pressed=true]{background:var(--sun);color:#1b1408}
body.clean #hint, body.clean #hud, body.clean #modeBadge, body.clean .simbar{display:none!important}
#vres button[aria-pressed=true]{background:var(--sun);color:#1b1408}
.name-in{background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 7px;font:500 14px var(--f-ui);width:min(260px,30vw);min-width:0}
.name-in:hover,.name-in:focus{border-color:var(--line-2);background:var(--well)}
.top-r{margin-left:auto;display:flex;gap:8px;flex:none;align-items:center}
.tbtn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:5px 11px;font:500 12px var(--f-ui)}
.tbtn.accent{background:var(--sun);border-color:var(--sun);color:#1b1408}
.rail{grid-area:rail;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.tool{position:relative;width:44px;height:42px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.tool:hover{background:var(--panel);color:var(--fg)}
.tool[aria-pressed=true]{background:var(--panel-2);border-color:var(--line-2);color:var(--sun)}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool .k{position:absolute;right:4px;bottom:2px;font:500 9px var(--f-mono);color:var(--faint)}
.tool{height:48px;grid-template-rows:1fr auto;padding:4px 0 3px;gap:1px}
.tool .lb{font:500 9px/1 var(--f-ui);color:inherit;opacity:.85;letter-spacing:.02em;max-width:44px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tool svg{width:20px;height:20px}
.stepoff{display:none!important}
.steps{position:sticky;top:0;z-index:3;background:var(--frame);padding:0 0 8px;margin-bottom:2px}
.steps .row{display:flex;gap:3px}
.steps .st{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;padding:6px 2px 5px;font:600 10.5px var(--f-ui);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.steps .st b{font:600 10px var(--f-mono);width:16px;height:16px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--faint)}
.steps .st.done b{background:var(--line-2);color:var(--fg)}
.steps .st[aria-current=step]{border-color:var(--sun);color:var(--fg)}
.steps .st[aria-current=step] b{border-color:var(--sun);color:var(--sun)}
.steps .now{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;margin-top:6px;padding:9px 11px;font:400 12px/1.45 var(--f-ui);color:var(--muted)}
.steps .now h4{margin:0 0 4px;font:600 12.5px var(--f-ui);color:var(--fg)}
.steps .now .go{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.rail .sep{height:1px;background:var(--line);margin:3px 6px;flex:none}
.view{grid-area:view;position:relative;background:#000;border-radius:6px;overflow:hidden;min-height:0;border:1px solid var(--line)}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#glc{pointer-events:none}
#ov{touch-action:none;cursor:grab}
.hint{position:absolute;left:10px;top:10px;max-width:min(520px,calc(100% - 300px));display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:rgba(14,17,21,.78);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.06);border-radius:5px;padding:6px 10px;font-size:12px;color:var(--muted);pointer-events:none}
.hint b{color:var(--fg);font-weight:600}
.hud{position:absolute;left:10px;bottom:10px;font:11px var(--f-mono);color:rgba(230,234,238,.75);background:rgba(14,17,21,.6);border-radius:4px;padding:3px 7px;font-variant-numeric:tabular-nums;pointer-events:none}
.tl{grid-area:tl;display:flex;align-items:center;gap:10px;padding:8px 2px 0;min-width:0;flex-wrap:wrap}
.tl .vbtn{background:var(--panel-2)}
.tlinfo{display:flex;flex-direction:column;gap:1px;min-width:118px;font-variant-numeric:tabular-nums}
.tlinfo b{font:600 12px var(--f-mono);color:var(--fg)} .tlinfo span{font:11px var(--f-mono);color:var(--faint)}
.track{position:relative;flex:1 1 220px;min-width:160px;height:26px;border-radius:4px;background:var(--well);border:1px solid var(--line);cursor:pointer;touch-action:none}
.track .pre{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(239,178,77,.05) 0 5px,rgba(239,178,77,.16) 5px 10px);border-right:1px dashed rgba(239,178,77,.6);border-radius:4px 0 0 4px;overflow:hidden}
.track .pre span{position:absolute;left:5px;top:6px;font:600 9px var(--f-mono);letter-spacing:.08em;color:rgba(239,178,77,.95);white-space:nowrap}
.track canvas.cache{position:absolute;left:0;right:0;bottom:1px;height:3px;width:100%;pointer-events:none}
.track .rng{position:absolute;top:4px;bottom:4px;background:rgba(166,203,221,.22);border:1px solid rgba(166,203,221,.55);border-radius:3px}
.track .h{position:absolute;top:-3px;bottom:-3px;width:8px;margin-left:-4px;background:var(--mist);border-radius:2px;cursor:ew-resize}
.track .h.out{background:var(--mist)} .track .ph{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--sun);pointer-events:none}
.tlnum{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.tlnum input{width:62px;background:var(--well);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font:12px var(--f-mono);color:var(--fg)}
.tlspd{font-size:11.5px;color:var(--muted);white-space:nowrap}
.vbtn{display:flex;align-items:center;gap:6px;background:rgba(14,17,21,.82);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font:500 12px var(--f-ui);color:var(--fg);white-space:nowrap}
.vbtn svg{width:13px;height:13px;fill:currentColor}
.vbtn[aria-pressed=true]{border-color:var(--sun);color:var(--sun)}
.simbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.05);pointer-events:none}
.simbar i{display:block;height:100%;width:0;background:var(--mist);transition:width .12s}
.simbar i.fin{background:var(--sun)}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#1d232b 0%,#07090b 75%);z-index:4}
.loader .card{width:min(380px,80%);display:flex;flex-direction:column;gap:10px}
.loader .t{font:italic 28px var(--f-display)}
.loader .s{font:12px var(--f-mono);color:var(--muted);min-height:1.4em}
.loader .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mist),var(--sun));transition:width .2s}
.loader.err .s{color:var(--danger);white-space:pre-wrap;max-height:40vh;overflow:auto}
.toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:6px 12px;font-size:12px;z-index:5;white-space:nowrap;display:flex;gap:10px;align-items:center}
.toast button{background:none;border:0;color:var(--sun);font-weight:600;padding:0}
.drop{position:absolute;inset:10px;border:2px dashed var(--mist);border-radius:8px;display:grid;place-items:center;background:rgba(8,10,12,.75);z-index:3;font:500 15px var(--f-ui);pointer-events:none}
.strip{grid-area:strip;display:flex;gap:8px;align-items:stretch;padding-top:8px;min-width:0;overflow-x:auto;scrollbar-width:thin}
.strip .lab{flex:none;display:flex;flex-direction:column;justify-content:center;gap:4px;width:88px;font-size:11.5px;color:var(--muted);line-height:1.35}
.strip .lab b{color:var(--fg);font:600 10.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase}
.var{flex:none;position:relative;width:176px;aspect-ratio:16/9;max-width:100%;border-radius:5px;border:1px solid var(--line);background:#000;padding:0;overflow:hidden}
.var canvas{width:100%;height:100%;display:block}
.var:hover{border-color:var(--mist)}
.var span{position:absolute;left:6px;bottom:4px;font:500 10px var(--f-mono);color:rgba(220,226,232,.7)}
.var.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:sh 1.2s linear infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.insp{grid-area:insp;overflow-y:auto;overflow-x:hidden;min-height:0;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;padding-bottom:4px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 12px}
.sec>summary{list-style:none;cursor:pointer;padding:10px 0;font:600 10.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg) translateY(-2px)}
.sec[open]>summary::after{transform:rotate(-135deg)}
.body{display:flex;flex-direction:column;gap:6px;padding-bottom:12px}
.sub-h{font:500 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:100px minmax(0,1fr) 64px;align-items:center;gap:8px;min-height:24px}
.row label{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{font:11px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.wide{grid-template-columns:100px minmax(0,1fr)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--mist) var(--p),var(--line-2) var(--p))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--mist) var(--p),var(--line-2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);margin-top:-4.5px;border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--fg);border:2px solid var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 11.5px var(--f-ui);padding:3px 9px;border-radius:3px;border:1px solid var(--line-2);background:transparent;color:var(--muted)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed=true]{color:#10161b;background:var(--mist);border-color:var(--mist)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border-radius:5px;border:1px solid var(--line);background:var(--well);color:var(--muted);font-size:11px;line-height:1.15;text-align:center}
.tile svg{width:30px;height:22px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tile:hover{color:var(--fg);border-color:var(--line-2)}
.tile[aria-pressed=true]{color:var(--fg);border-color:var(--mist);box-shadow:inset 0 0 0 1px var(--mist)}
.note{font-size:11.5px;color:var(--faint);line-height:1.45}
.cur{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.cur svg,.card svg{width:36px;height:28px;fill:none;stroke:var(--mist);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.cur b{display:block;font:600 13px var(--f-ui);color:var(--fg)} .cur span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.cur em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:4px}
.libtabs{display:flex;flex-wrap:wrap;gap:4px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.card{display:grid;grid-template-columns:38px minmax(0,1fr);gap:9px;text-align:left;align-items:start;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--fg)}
.card:hover{border-color:var(--mist)} .card[aria-current=true]{border-color:var(--sun)}
.card b{display:block;font:600 13px var(--f-ui)} .card span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.card em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:5px;line-height:1.35} .card em i{font-style:normal;color:var(--mist)}
.libcat{font:600 10.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.colr{display:flex;align-items:center;gap:8px} .colr input[type=number]{background:var(--well);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font:12px var(--f-mono);color:var(--fg)} .colr input[type=color]{width:34px;height:22px;padding:0;border:1px solid var(--line-2);border-radius:4px;background:none}
.note b{color:var(--muted);font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:4px 10px;font:500 12px var(--f-ui)}
.btn.prim{background:var(--mist);border-color:var(--mist);color:#0e1418}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dims label{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.dims input{background:var(--well);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:12px var(--f-mono);width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.shelf .it{position:relative;border:1px solid var(--line);border-radius:5px;background:#000;padding:0;overflow:hidden;aspect-ratio:16/9;text-align:left}
.shelf .it img{width:100%;height:100%;object-fit:cover;display:block}
.shelf .it span{position:absolute;left:5px;bottom:3px;right:20px;font:500 10.5px var(--f-ui);color:#dde3e9;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf .it i{position:absolute;right:3px;top:2px;font:normal 13px var(--f-ui);color:#aab;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.4)}
.empty{color:var(--muted);font-size:12px;line-height:1.5}
.kbd{font:500 10.5px var(--f-mono);background:var(--panel-2);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;color:var(--fg)}
.modal{position:fixed;inset:0;background:rgba(6,8,10,.66);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mcard{width:min(760px,100%);max-height:calc(100% - 48px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font:italic 400 24px var(--f-display)}
.mbody{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbody p{margin:0;max-width:68ch;color:var(--muted);line-height:1.55}
.mbody p b{color:var(--fg);font-weight:600}
pre.code{margin:0;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:12px;font:11.5px/1.5 var(--f-mono);color:#c9d3dc;overflow:auto;max-height:260px;white-space:pre}
.x{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;display:flex;flex-direction:column;gap:8px;padding-block:6px 16px}
  .top{flex-wrap:wrap;gap:8px 10px}
  .rail{flex-direction:row;overflow-x:auto;padding:0}
  .rail .sep{width:1px;height:auto;margin:6px 2px}
  .view{height:56vh;min-height:300px;flex:none}
  .insp{overflow:visible}
}
@media (prefers-reduced-motion:reduce){.simbar i,.loader .bar i{transition:none}.var.busy::after{animation:none}}
</style>
</head>

<div id="app">
  <header class="top">

    <div class="top-r">
      <button class="tbtn accent" id="exportBtn">Export</button>
    </div>

<script>
/* =====================================================================
   SHADERS — every volume pass renders one z-slice of a 3D texture at a time
   ===================================================================== */
const HEAD=`#version 300 es
precision highp float; precision highp int; precision highp sampler2D; precision highp sampler3D;
`;
const VS_FS=`#version 300 es
layout(location=0) in vec2 aPos; void main(){ gl_Position=vec4(aPos,0.,1.); }`;

/* tileable noise: 0 shape (perlin-worley, worley fbm, perlin fbm), 1 detail (worley 4/8/16 + perlin fbm), 2 curl field */
const NOISE_GLSL=`
vec3 h33(vec3 p){ uvec3 q=uvec3(ivec3(p)+4096)*uvec3(1597334673u,3812015801u,2798796415u); q=(q.x^q.y^q.z)*uvec3(1597334673u,3812015801u,2798796415u); return vec3(q)*(1.0/4294967295.0); }
float gd(vec3 i,vec3 c,vec3 f,float per){ vec3 g=h33(mod(i+c,per))*2.0-1.0; return dot(normalize(g+1e-5),f-c); }
float perlin(vec3 p,float per){ vec3 i=floor(p),f=fract(p); vec3 u=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(mix(gd(i,vec3(0,0,0),f,per),gd(i,vec3(1,0,0),f,per),u.x),mix(gd(i,vec3(0,1,0),f,per),gd(i,vec3(1,1,0),f,per),u.x),u.y),
             mix(mix(gd(i,vec3(0,0,1),f,per),gd(i,vec3(1,0,1),f,per),u.x),mix(gd(i,vec3(0,1,1),f,per),gd(i,vec3(1,1,1),f,per),u.x),u.y),u.z); }
float worley(vec3 p,float per){ vec3 i=floor(p),f=fract(p); float md=1.0;
  for(int z=-1;z<=1;z++) for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){ vec3 c=vec3(x,y,z); vec3 d=c+h33(mod(i+c,per))-f; md=min(md,dot(d,d)); }
  return 1.0-sqrt(md); }
float pfbm(vec3 p,float f0,int oct){ float a=0.5,s=0.,t=0.,f=f0; for(int k=0;k<5;k++){ if(k>=oct) break; s+=perlin(p*f,f)*a; t+=a; a*=0.5; f*=2.; } return clamp(s/t*1.15+0.5,0.,1.); }
float wfbm(vec3 p,float f0){ return worley(p*f0,f0)*0.625+worley(p*f0*2.,f0*2.)*0.25+worley(p*f0*4.,f0*4.)*0.125; }
`;
const FS_NOISE=HEAD+NOISE_GLSL+`
uniform float uZ; uniform float uN; uniform int uMode; out vec4 o;
vec3 pot(vec3 p){ return vec3(perlin(p*3.,3.)+0.5*perlin(p*6.+11.,6.), perlin(p*3.+vec3(31.,7.,19.),3.)+0.5*perlin(p*6.+vec3(5.,43.,2.),6.), perlin(p*3.+vec3(13.,57.,29.),3.)+0.5*perlin(p*6.+vec3(23.,3.,61.),6.)); }
void main(){
  vec3 p=vec3(gl_FragCoord.xy/uN,uZ);
  if(uMode==1){ o=vec4(worley(p*4.,4.),worley(p*8.,8.),worley(p*16.,16.),pfbm(p,4.,4)); return; }
  if(uMode==2){ float e=0.5/uN; // curl of a tileable vector potential: divergence-free swirls
    vec3 dx=vec3(e,0,0), dy=vec3(0,e,0), dz=vec3(0,0,e);
    vec3 px0=pot(p-dx), px1=pot(p+dx), py0=pot(p-dy), py1=pot(p+dy), pz0=pot(p-dz), pz1=pot(p+dz);
    vec3 c=vec3((py1.z-py0.z)-(pz1.y-pz0.y),(pz1.x-pz0.x)-(px1.z-px0.z),(px1.y-px0.y)-(py1.x-py0.x))/(2.*e);
    o=vec4(c*0.09,0.); return; }
  float pf=pfbm(p,4.,3), wf=wfbm(p,4.);
  float pw=clamp((pf-(wf-1.0))/(2.0-wf),0.,1.); pw=smoothstep(0.28,0.95,pw);
  o=vec4(pw, wfbm(p,6.), wfbm(p,8.), pfbm(p,3.,4));
}`;

/* voxel helpers shared by the volume passes */
const VOX_GLSL=`
uniform vec3 uDims, uSize, uLo; uniform float uZ, uHgt;    // the box: lower corner and size in world metres; uHgt is the asset's design height
vec3 vU(){ return vec3(gl_FragCoord.xy/uDims.xy,uZ); }
vec3 u2p(vec3 u){ return uLo+u*uSize; }
vec3 p2u(vec3 p){ return (p-uLo)/uSize; }
`;

/* stand-in ground: 0 none, 1 flat, 2 slope, 3 peak, 4 valley, 5 bowl, 6 street, 7 pool, 8 lake (mirrored in JS: terrHJ) */
const SCENE_ALB_GLSL=`
vec3 sceneAlb(vec3 fp,vec3 N){ float h=fp.y; vec2 q=fp.xz; float n=tn(q/90.), n2=tn(q/23.);
  vec3 grass=vec3(0.075,0.11,0.04)*(0.85+0.3*n2), field=mix(vec3(0.11,0.12,0.045),vec3(0.13,0.11,0.05),step(0.5,fract(sin(dot(floor(q/38.),vec2(12.9898,78.233)))*43758.5453)));
  vec3 c=mix(grass,field,smoothstep(40.,25.,h)*smoothstep(-0.2,0.2,n)*0.8);
  c=mix(c,vec3(0.03,0.045,0.022),smoothstep(0.05,0.35,n+tn(q/40.)*0.4)*smoothstep(25.,60.,h)*smoothstep(380.,250.,h));   // woods on the hillsides
  c=mix(c,vec3(0.11,0.105,0.1)*(0.8+0.4*n2),clamp(smoothstep(0.82,0.62,N.y)+smoothstep(300.,430.,h+n*40.),0.,1.));   // rock where it is steep or high
  c=mix(c,vec3(0.72,0.74,0.78),smoothstep(500.,560.,h+n*50.)*smoothstep(0.55,0.8,N.y));                              // snow on the peaks
  float rd_=abs(q.y-(30.*sin(q.x/130.)+12.*sin(q.x/47.)))-3.5; c=mix(c,vec3(0.16,0.15,0.13),smoothstep(1.,-1.,rd_)*smoothstep(30.,8.,h));   // the road
  return c; }
`;
const TERR_GLSL=`
uniform int uGround; uniform vec4 uGP; uniform vec4 uWater;   // uGP: relief, feature size, street half-width, seed · uWater: centre xz, radius, on
float thash(float n){ return fract(sin(n*127.1+311.7)*43758.5453); }
float tn(vec2 p){ return sin(p.x*1.7+sin(p.y*1.3))*0.5+sin(p.y*2.1+sin(p.x*0.9)*1.4)*0.35+sin((p.x+p.y)*3.7)*0.15; }
uniform vec4 uMt[24]; uniform int uNMt; uniform sampler2D uHMap; uniform vec4 uHMapB;   // shot scene: bumps (x, z, radius, height), and the same terrain baked to a heightmap
float sceneH(vec2 q){ if(uHMapB.z>0.){ vec2 hu=(q-uHMapB.xy)/uHMapB.zw; if(all(greaterThanEqual(hu,vec2(0.)))&&all(lessThanEqual(hu,vec2(1.)))) return textureLod(uHMap,hu,0.).r; } float h=0.; for(int i=0;i<24;i++){ if(i>=uNMt) break; vec4 m=uMt[i]; vec2 d=(q-m.xy)/m.z; h+=m.w*exp(-dot(d,d)); }
  float hi=smoothstep(60.,360.,h); h+=(tn(q/140.)*9.+tn(q/47.)*3.5+abs(tn(q/23.))*2.)*(0.25+hi*1.6)+tn(q/310.)*4.;
  return h; }
float terrH(vec2 q){
  if(uGround==9) return sceneH(q);
  if(uGround<2||uGround>6) return 0.;
  float Hg=uGP.x, L=uGP.y; vec2 s=q/L; float n=tn(s*4.+uGP.w)*0.06+tn(s*9.+uGP.w*1.7)*0.025;
  if(uGround==2) return Hg*(smoothstep(-0.6,0.6,s.x)+n);
  if(uGround==3){ float r2=dot(s,s); return Hg*(exp(-r2/0.06)+n*0.7); }
  if(uGround==4) return Hg*((1.-exp(-s.y*s.y/0.045))*(0.8+0.2*sin(s.x*5.+uGP.w))+n);
  if(uGround==5){ float r2=dot(s,s); return Hg*((1.-exp(-r2/0.06))+n); }
  float w=uGP.z; if(abs(q.y)<w) return 0.; float lot=w*1.8; if(abs(q.y)>w+lot*1.6) return 0.;
  float c=floor(q.x/lot); if(fract(q.x/lot)<0.1) return 0.; return Hg*(0.45+0.55*thash(c*2.+(q.y>0.?1.:0.)));
}
float isWater(vec2 q){ if(uWater.w<0.5) return 0.; float r=length(q-uWater.xy); float rr=uWater.z*(1.+0.05*tn(q/uWater.z*3.)); return 1.-smoothstep(rr-uWater.z*0.02,rr,r); }
bool terrOn(){ return (uGround>1&&uGround<7)||uGround==9; }
vec2 terrG(vec2 q){ float e=max(uGP.y*0.004,0.03); return vec2(terrH(q+vec2(e,0))-terrH(q-vec2(e,0)),terrH(q+vec2(0,e))-terrH(q-vec2(0,e)))/(2.*e); }
vec3 terrN(vec2 q){ vec2 g=terrG(q); return normalize(vec3(-g.x,1.,-g.y)); }
`;

/* blockers: simple shapes the fog cannot enter (sphere, box, wall), as exact distance functions: no voxels, no cost to speak of */
const BLK_GLSL=`
uniform int uNBK; uniform vec4 uBK0[8], uBK1[8];   // centre + type (0 sphere, 1 box) · half size (sphere: radius in x) + turn about the vertical
float blkSD(vec3 p){ float d=1e9; for(int i=0;i<8;i++){ if(i>=uNBK) break; vec4 a=uBK0[i], b=uBK1[i]; vec3 q=p-a.xyz;
    if(a.w<0.5){ d=min(d,length(q)-b.x); continue; } float c=cos(b.w), s=sin(b.w); q.xz=vec2(c*q.x+s*q.z,-s*q.x+c*q.z); vec3 e=abs(q)-b.xyz; d=min(d,length(max(e,0.))+min(max(e.x,max(e.y,e.z)),0.)); }
  return d; }
vec3 blkN(vec3 p){ const vec2 k=vec2(1,-1); float h=0.05; return normalize(k.xyy*blkSD(p+k.xyy*h)+k.yyx*blkSD(p+k.yyx*h)+k.yxy*blkSD(p+k.yxy*h)+k.xxx*blkSD(p+k.xxx*h)); }
`;
/* template mass from primitives: ellipsoids, tapered capsules, rounded boxes, soft-unioned and roughened */
const FS_GEN=HEAD+VOX_GLSL+TERR_GLSL+BLK_GLSL+`
#define NP 64
uniform int uNP, uNPT; uniform vec4 uP0[NP], uP1[NP], uP2[NP]; uniform vec2 uRotY; uniform vec3 uRotC;
uniform sampler3D uNT; uniform float uNoiseAmp, uNoiseScale, uSoft, uFl; uniform vec3 uSeedOff; uniform int uProfile;
uniform int uForm; uniform vec4 uF0, uF1; uniform vec2 uWdir, uFOff;
uniform sampler2D uMask; uniform vec4 uMaskB; uniform vec4 uLr[4]; uniform int uNL;   // shot: painted layers (mask channel per layer) · rule: kind, a, b, c
out vec4 o;
float sdPrim(vec3 p,int i){ vec4 a=uP0[i], b=uP1[i], c=uP2[i]; int ty=int(a.w+0.5);
  if(ty==0){ vec3 q=(p-a.xyz)/b.xyz; float k=length(q); return (k-1.)*min(b.x,min(b.y,b.z)); }
  if(ty==1){ vec3 pa=p-a.xyz, ba=c.xyz-a.xyz; float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.,1.); return length(pa-ba*h)-mix(b.x,c.w,h); }
  vec3 q=abs(p-a.xyz)-b.xyz+c.x; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-c.x; }
void main(){
  vec3 u=vU(), p=u2p(u);
  float n=textureLod(uNT,p/uNoiseScale+uSeedOff,0.).a-0.5, n2=textureLod(uNT,p/(uNoiseScale*0.4)+uSeedOff.zxy,0.).a-0.5;
  float disp=(n+n2*0.45)*uNoiseAmp;
  float m=0.;
  vec3 pr=p-uRotC; pr=vec3(uRotY.x*pr.x+uRotY.y*pr.z,pr.y,-uRotY.y*pr.x+uRotY.x*pr.z)+uRotC;   // the type's shape turned with its volume
  for(int i=0;i<NP;i++){ if(i>=uNP) break; float w=uP1[i].w; float d=sdPrim(i<uNPT?pr:p,i)+disp;
    float v=smoothstep(uSoft,-uSoft,d);
    if(w>=0.) m=1.-(1.-m)*(1.-w*v); else m*=1.+w*v; }
  float y=max(p.y,0.)/uHgt;
  if(uProfile==1) m*=exp(-y*2.2)*1.15;            // densest at the ground
  else if(uProfile==2) m*=mix(1.,0.3,y);           // wisps thin as they rise
  else if(uProfile==3) m*=smoothstep(0.05,0.22,y);  // floating mass with a ragged base
  // formation: fog that forms by a rule relative to the ground (layer, fill to a level, upslope, sheets, deck, lid, even haze)
  float gh=uGround>0?terrH(p.xz):-1e6, hy=p.y-gh; float mf=0.;
  vec2 rq=abs(p.xz-uFOff)-uF1.xy; float rgn=1.-smoothstep(-uF1.z,0.,max(rq.x,rq.y)+disp*0.6);
  if(uForm==1){ float T=uF0.x; float R=max(T*5.,uF0.z); float hm=0.25*(terrH(p.xz+vec2(R,0))+terrH(p.xz-vec2(R,0))+terrH(p.xz+vec2(0,R))+terrH(p.xz-vec2(0,R)));
    float low=clamp((hm-terrH(p.xz))/T,-1.,3.); float Te=T*(1.+uF0.y*max(low,0.)*0.8)*(1.-0.35*uF0.y*max(-low,0.));
    float h=hy+disp*0.5; mf=smoothstep(Te,Te*0.25,h)*exp(-max(h,0.)/Te*0.9)*1.15; }
  else if(uForm==2){ float lv=uF0.x+disp*0.4, e=uF0.y; mf=smoothstep(lv+e,lv-e,p.y)*(0.75+0.25*smoothstep(lv,lv-e*6.,p.y)); }
  else if(uForm==3){ vec2 g=terrG(p.xz); float gl=length(g); float wv=gl>0.02?dot(g/gl,uWdir)*smoothstep(0.02,0.25,gl):0.;
    float T=uF0.x; float h=hy+disp*0.5; mf=smoothstep(T,T*0.2,h)*smoothstep(-0.1,0.5,wv)*smoothstep(uF0.y-T*1.5,uF0.y+T*0.5,p.y); }
  else if(uForm==4){ float y=p.y+disp*0.35; for(int k=0;k<6;k++){ if(float(k)>=uF0.x) break; float yk=uF0.z+(uF0.w-uF0.z)*(float(k)+0.5)/uF0.x; mf=max(mf,exp(-pow((y-yk)/uF0.y,2.))*(1.-0.12*float(k))); } }

const SCENE=(()=>{ const bumps=[

function drawSpheres(){ const L=movList(); if(!L.length||UI.clean) return; const tNow=sceneTime(), B=camBasis(CAM);

function shiftRec(o,d){ if(!o||typeof o!=='object') return; const mv=p=>{ for(let i=0;i<3;i++) p[i]=+(p[i]+d[i]).toPrecision(6); };
  for(const k of Object.keys(o)){ const v=o[k]; if(v==null) continue;
    if((k==='dom'||k==='adom')&&Array.isArray(v)&&v.length===2&&Array.isArray(v[0])){ mv(v[0]); mv(v[1]); }
    else if((k==='dabs'||k==='pts')&&Array.isArray(v)){ for(const p of v) if(Array.isArray(p)&&p.length>=3&&typeof p[0]==='number') mv(p); }
    else if((k==='tip'||k==='mid')&&Array.isArray(v)&&v.length===3) mv(v);
    else if(typeof v==='object') shiftRec(v,d); }
  if(typeof o.x==='number'&&typeof o.y==='number'&&typeof o.z==='number'&&'shape' in o){ o.x=+(o.x+d[0]).toPrecision(6); o.y=+(o.y+d[1]).toPrecision(6); o.z=+(o.z+d[2]).toPrecision(6); } }

const FLOATS=new Set(['cloud','scud','deck','curtain','haze','shafts','inversion','hang','veil','wisps','tendril','puff','glowmist','swirl']);

function retypeVol(k){ const old=REC, p=old.off||[0,0,0], k0=SHOT.els.indexOf(old); if(k0<0) return; const T=LIB[k]; const r=makeRecipe(k,old.cls||'mid'); r.name=T.label;

/* =====================================================================

   ===================================================================== */
/* the body: Still (only the detail moves), Simple (breathe, roll or drift: no simulation, loops, scrubs instantly) or Simulate (wind, influencers, colliders, movers) */
const BODY_KINDS=[['sim','Simulate','The full simulation: wind, rise, churn, drain, influencers, colliders and movers'],['gentle','Simple','A breathe, roll or drift of the whole shape, with no simulation: it loops and scrubs instantly'],['still','Still','The shape stays where it is; only its detail moves']];

const DM_KINDS=[['pinned','Pinned','The detail only rides with the fog'],['boil','Boil','Each size of detail drifts past the others, so the wisps slowly change shape'],['swirl','Swirl','Small eddies turn the detail over in place'],['roll','Roll','The detail turns over along a direction, like the top of a rolling bank'],['stream','Stream','The detail is combed along a direction, like a breeze across the surface']];
const DM_IDX={pinned:0,boil:1,swirl:2,roll:3,stream:4}, BM_IDX={breathe:1,roll:2,sway:3};

function dirOfAng(a,rec){ const d=(a==null?(animOf(rec).windDir??70):a)*D2R; return [Math.sin(d),0,-Math.cos(d)]; }

const PB={on:false,stop:false};
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>r()));

  const mime=kind==='movie'?['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m)):null; if(kind==='movie'&&!mime) kind='frames';

function slider(parent,o){
  const row=document.createElement('div'); row.className='row'; const id='s'+Math.random().toString(36).slice(2,8); if(o.tip) row.title=o.tip;
  row.innerHTML=`<label for="${id}">${o.label}</label><input type="range" id="${id}" min="0" max="1000" step="1"><output></output>`;
  const inp=row.querySelector('input'), out=row.querySelector('output');
  const toS=v=>o.log?Math.log(v/o.min)/Math.log(o.max/o.min):(v-o.min)/(o.max-o.min), fromS=s=>o.log?o.min*Math.pow(o.max/o.min,s):o.min+s*(o.max-o.min);
  const refresh=()=>{ const v=o.get(); const s=clamp(toS(v),0,1); inp.value=Math.round(s*1000); inp.style.setProperty('--p',(s*100)+'%'); out.textContent=o.fmt?o.fmt(v):v.toFixed(2); };
  inp.addEventListener('input',()=>{ let v=fromS(inp.value/1000); if(o.step) v=Math.round(v/o.step)*o.step; o.set(v); inp.style.setProperty('--p',(inp.value/10)+'%'); out.textContent=o.fmt?o.fmt(v):v.toFixed(2); });
  inp.addEventListener('change',()=>{ o.commit&&o.commit(); });
  // click the number to type any value, past either end of the slider too
  out.title='Click to type a value. Any value works, even beyond the slider'; out.style.cursor='text';
  out.addEventListener('click',()=>{ if(out.querySelector('input')) return; const cur=out.textContent, pctU=/%/.test(cur), kmU=/km/.test(cur), cmU=/\bcm\b/.test(cur); const f=document.createElement('input'); f.type='text'; f.value=(cur.match(/-?[\d.]+(e-?\d+)?/)||[''])[0]; f.style.cssText='width:58px;font:inherit;background:var(--well);color:var(--fg);border:1px solid var(--sun);border-radius:3px;padding:0 3px';
    out.textContent=''; out.appendChild(f); f.focus(); f.select(); let done=false;
    const fin=ok=>{ if(done) return; done=true; if(ok){ let v=parseFloat(f.value); if(isFinite(v)){ if(pctU) v/=100; if(kmU) v*=1000; if(cmU) v/=100; if(o.step) v=Math.round(v/o.step)*o.step; o.set(v); o.commit&&o.commit(); } } refresh(); };
    f.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); fin(true); } else if(e.key==='Escape'){ fin(false); } e.stopPropagation(); }); f.addEventListener('blur',()=>fin(true)); });
  refresh(); parent.appendChild(row); return refresh; }

  const ES=(label,min,max,key,fmt,log,tip)=>S_(label,min,max,()=>E[key],v=>E[key]=v,fmt,markSimU,log,tip);
  subH(b,'Source');

  refreshers.push(slider(b,ES('Patchy',0,1,'patch',pct,false,'Breaks the source into drifting patches that come and go')));
  refreshers.push(slider(b,ES('Pulse',0,1,'pulse',pct,false,'The source breathes: stronger and weaker over time, smoothly')));
  subH(b,'Emission');
  refreshers.push(slider(b,ES('Rate',0,1,'rate',pct,false,'How much smoke comes out')));
  refreshers.push(slider(b,ES('Push',0,1,'push',pct,false,'Speed it leaves the source: a jet or a gentle seep')));

  else if(v==='overcast') set(55,30,0.12,6500,1.6,7000); else if(v==='dusk') set(3,-25,1.2,2600,0.3,13000,1.5); else set(28,60,0.06,7800,0.08,14000);

function scaleStrokes(rec,k){ const kr=Math.cbrt(k[0]*k[1]*k[2]); const q=v=>+v.toPrecision(5); const o=rec.off||[0,0,0]; rec.strokes=rec.strokes.map(s=>({...s,r:q(s.r*kr),dabs:s.dabs.map(d=>d.map((v,i)=>q(i<3?o[i]+(v-o[i])*k[i]:v*k[i%3])))})); }   /* about where it stands (a volume on the set), or the origin */

/* ---------------- undo ---------------- */
const undoS=[], redoS=[];
function pushUndo(){ const s=JSON.stringify(REC); if(undoS[undoS.length-1]===s) return; undoS.push(s); if(undoS.length>60) undoS.shift(); redoS.length=0; autosave(); }
function restore(s){ const old=REC; REC=JSON.parse(s); if(UI.ws==='shot'){ if(UI.layer>=0) SHOT.els[UI.layer]=REC; else SHOT.blank=REC; maskBuild(); } else $('#assetName').value=REC.name; const shapeSame=old.template===REC.template&&old.seed===REC.seed&&JSON.stringify(old.size)===JSON.stringify(REC.size)&&JSON.stringify(old.dom)===JSON.stringify(REC.dom)&&JSON.stringify([old.gnd,old.form])===JSON.stringify([REC.gnd,REC.form])&&old.strokes.length===REC.strokes.length&&MAIN.N===simN(REC);
  const fk=r=>JSON.stringify({...r,strokes:0,anim:0,time:0,name:0,den:0,det:0,looks:0,style:0,adom:0,lod:0});
  const J=JSON.stringify, sameStrokes=J(old.strokes)===J(REC.strokes);
  const fkb=r=>fk({...r,dom:0,xpad:0,fit:0,budgetK:0,afix:0});
  if(MAIN.dims&&MAIN.phase!=='form'&&J(old.adom)!==J(REC.adom)&&REC.adom&&old.adom&&MAIN.phase==='anim'&&fk(old)===fk(REC)){ rebox(MAIN,ARec(REC),old.adom); dirty.light=true; }   // the animation box changed back: resample, nothing re-runs
  if(MAIN.dims&&MAIN.phase==='shape'&&fk(old)!==fk(REC)&&fkb(old)===fkb(REC)&&sameStrokes&&old.dom&&REC.dom&&MAIN.N===simN(REC)){ rebox(MAIN,REC,old.dom); dirty.light=true; buildPanels(); autosave(); return; }   // only the box changed: resample the fog into it, nothing re-forms
  const fkd=r=>fk({...r,dom:0,xpad:0}); if(!sameStrokes&&fk(old)!==fk(REC)&&fkd(old)===fkd(REC)&&old.dom&&MAIN.phase!=='form') REC.dom=old.dom;   // a stroke grew the box: keep the bigger box, no need to form again
  if(fk(old)!==fk(REC)||MAIN.N!==simN(REC)){ if(shapeSame) markSim(); else markMass(); }          // the form itself changed: form again
  else { if(JSON.stringify(old.strokes)!==JSON.stringify(REC.strokes)) reShape();                  // strokes only: lay them again on the formed fog, no forming
    if(JSON.stringify([old.anim,old.time])!==JSON.stringify([REC.anim,REC.time])) markAnim(); markLight(); }
  buildPanels(); autosave(); }
function undo(){ if(undoS.length<2){ toast('Nothing to undo'); return; } redoS.push(undoS.pop()); restore(undoS[undoS.length-1]); toast('Undone'); }
function redo(){ if(!redoS.length){ toast('Nothing to redo'); return; } const s=redoS.pop(); undoS.push(s); restore(s); toast('Redone'); }
let saveH=0; function autosave(){ clearTimeout(saveH); const k=wsKey(), r=UI.ws==='shot'?SHOT:REC; saveH=setTimeout(()=>store.set(k,r),400); }

const THUMB=mkCtx(56); let varRun=0;
function jitterRecipe(base,i){ const r=JSON.parse(JSON.stringify(base)); const R=mulberry(base.seed*31+i*977+Date.now()%1000); const j=(v,a,lo,hi)=>clamp(v+(R()*2-1)*a,lo,hi);
  r.seed=Math.floor(R()*9999); r.sim.turb=j(r.sim.turb,0.22,0.05,1); r.sim.eddy=+(r.sim.eddy*Math.exp((R()*2-1)*0.45)).toPrecision(3); r.sim.age=j(r.sim.age,0.22,0.1,1); r.sim.lift=j(r.sim.lift,0.25,-1,1);
  r.det.billow=j(r.det.billow,0.3,0,1); r.det.brk=j(r.det.brk,0.2,0,0.9); r.det.amt=j(r.det.amt,0.15,0.2,1); r.sim.windDir=(r.sim.windDir+(R()*2-1)*60+360)%360; r.xpad=[0,0,0,0,0,0]; if(r.fit==='auto') r.dom=null; return r; }
async function renderThumb(rec,canvas,w,h){
  genMass(THUMB,rec); simReset(THUMB,rec,simClockT(rec)); while(THUMB.sim.step<THUMB.sim.steps){ simStep(THUMB,rec); if(THUMB.sim.step%20===0) await yieldUI(); }
  lightUpdate(THUMB,rec); const cam={...CAM,tgt:CAM.tgt.slice()};
  // keep the same framing relative to the asset's size
  const k=Math.hypot(...rec.size)/Math.hypot(...REC.size); cam.dist*=k; cam.tgt=mul(cam.tgt,k);
  for(let f=0;f<6;f++) renderPass(THUMB,rec,cam,w,h,1/(f+1),false,f,110);
  const fb=THUMB.acc.fb[THUMB.acc.cur]; gl.bindFramebuffer(gl.FRAMEBUFFER,fb); const px=new Float32Array(w*h*4); gl.readPixels(0,0,w,h,gl.RGBA,gl.FLOAT,px); gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const c2=canvas.getContext('2d'); const im=c2.createImageData(w,h); const ex=Math.pow(2,LOOK.expo);
  const tm=v=>{ v=Math.max(v*ex,0); v=(v*(2.51*v+0.03))/(v*(2.43*v+0.59)+0.14); v=clamp(v,0,1); return 255*(v<=0.0031308?v*12.92:1.055*Math.pow(v,1/2.4)-0.055); };
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const s=((h-1-y)*w+x)*4, d=(y*w+x)*4; im.data[d]=tm(px[s]); im.data[d+1]=tm(px[s+1]); im.data[d+2]=tm(px[s+2]); im.data[d+3]=255; }
  c2.putImageData(im,0,0); }
async function makeVariations(){ const run=++varRun; const strip=$('#strip'); strip.hidden=false; strip.innerHTML='<div class="lab"><b>Variations</b>Click one to use it. Your strokes are kept.</div>';
  const base=JSON.parse(JSON.stringify(REC)); const W=224,H=126;
  const items=[0,1,2,3,4,5].map(i=>{ const r=jitterRecipe(base,i); const b=document.createElement('button'); b.className='var busy'; b.innerHTML=`<canvas width="${W}" height="${H}"></canvas><span>take ${i+1}</span>`; b.onclick=()=>{ const keep={name:REC.name,strokes:REC.strokes}; REC={...JSON.parse(JSON.stringify(r)),...keep}; markMass(); pushUndo(); buildPanels(); toastUndo('Using take '+(i+1)); }; strip.appendChild(b); return {r,b}; });

  $('#hud').textContent=`${MAIN.dims?MAIN.dims.join('×'):''} voxels · ${fin?(UI.res/1024)+'K':'preview'} ${vw}×${vh} · ${ftAvg.toFixed(0)} ms · ${st}`; }
function toast(msg){ const t=$('#toast'); t.innerHTML=''; t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2400); }
function toastUndo(msg){ const t=$('#toast'); t.innerHTML=''; const s=document.createElement('span'); s.textContent=msg; const b=document.createElement('button'); b.textContent='Undo'; b.onclick=()=>{ undo(); t.hidden=true; }; t.append(s,b); t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,4000); }
function showLoader(msg,p){ const l=$('#loader'); l.hidden=false; l.classList.remove('err'); $('#loadMsg').textContent=msg; if(p!=null) $('#loadBar').style.width=(p*100).toFixed(1)+'%'; }
function hideLoader(){ $('#loader').hidden=true; }
function fail(msg){ const l=$('#loader'); l.hidden=false; l.classList.add('err'); $('#loadMsg').textContent=msg; ready=false; }

/* ---------------- boot ---------------- */
async function boot(){
  document.body.dataset.ws=UI.ws; const saved=store.get(wsKey()); if(saved&&saved.size&&saved.sim&&TEMPLATES[saved.template]){ const r=makeRecipe(saved.template,saved.cls||'mid',saved.seed); REC=migrateRecipe({...r,...saved,v:saved.v||1,sim:{...r.sim,...saved.sim},det:{...r.det,...saved.det},den:{...r.den,...saved.den}}); }
  const lk=store.get('brume.designer.look'); if(lk&&lk.v===2) Object.assign(LOOK,lk); else applyLight('morning');
  try{ if(window.__BRUME_TEST){ Object.assign(LOOK,window.__BRUME_TEST.look||{}); if(window.__BRUME_TEST.rec) REC=migrateRecipe(window.__BRUME_TEST.rec); } }catch(_){}
  if(UI.ws==='shot'){ SHOT=loadShot(); REC=null; activate(0,true); }
  $('#assetName').value=UI.ws==='shot'&&SHOT?SHOT.name:REC.name; UI.brushR=Math.max(...REC.size)*0.12; document.querySelectorAll('#wsSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ws===UI.ws)); if(UI.ws==='shot'){ UI.tool='place'; UI.layer=0; }
  buildRail(); buildHint(); buildPanels(); buildTimeline();
  if(!initGL()) return;
  const t0=performance.now();
  while(true){ const done=Object.values(PR).filter(progDone).length, n=Object.keys(PR).length; showLoader(`Compiling shaders ${done}/${n} · ${((performance.now()-t0)/1000).toFixed(1)} s`,0.02+0.16*done/n); if(done===n) break; await new Promise(r=>setTimeout(r,60)); }
  try{ for(const p of Object.values(PR)) progCheck(p); }catch(e){ fail(e.message); return; }
  await buildNoise();
  showLoader('Shaping the first asset',0.6); await yieldUI();
  resize(); new ResizeObserver(()=>resize()).observe($('#view'));
  if(UI.ws==='shot'){ const cam=store.get(wsKey()+'.cam'); if(cam&&cam.dist&&cam.sig===camSig()) Object.assign(CAM,cam); else setShotCam(); } else frameAll(); pushUndo(); hideLoader(); ready=true; requestAnimationFrame(frame);
}
glc.addEventListener('webglcontextlost',ev=>{ ev.preventDefault(); ready=false; showLoader('The GPU reset. Reload the page to continue.',0); });
boot();
</script>
