<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brume</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<style>
/* Layout: DCC workspace. Tool rail | viewport | inspector, timeline under the view. One dark look on purpose: viewports are judged on a dark surround. */
:root{
  --frame:#15191e; --panel:#1d232a; --panel-2:#252c35; --well:#10141a;
  --line:#2d353f; --line-2:#3a444f;
  --fg:#dce2e8; --muted:#8a95a1; --faint:#5b6571;
  --sun:#efb24d; --mist:#9fc6d9; --danger:#e06f5e;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--frame);color:var(--fg);font:13px/1.35 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
#app{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 12px;display:grid;grid-template-columns:46px minmax(0,1fr) 324px;grid-template-rows:48px minmax(0,1fr) 46px;grid-template-areas:"top top top" "rail view insp" "rail tl insp";column-gap:8px}
.top{grid-area:top;display:flex;align-items:center;gap:14px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.brand .word{font:italic 400 27px/1 var(--f-display);letter-spacing:.01em}
.brand .sub{font:500 10.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.seg{display:flex;gap:2px;background:var(--well);border:1px solid var(--line);border-radius:5px;padding:2px;flex:none}
.seg button{background:transparent;border:0;border-radius:3px;padding:4px 10px;font:500 12px var(--f-ui);color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--panel-2);color:var(--fg)}
.aovs{min-width:0;overflow-x:auto;scrollbar-width:none;flex:0 1 auto}
.top-r{margin-left:auto;display:flex;gap:8px;flex:none}
.tbtn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:5px 11px;font:500 12px var(--f-ui)}
.tbtn[aria-pressed=false]{color:var(--muted);border-style:dashed}
.tbtn.accent{background:var(--sun);border-color:var(--sun);color:#1b1408}
.rail{grid-area:rail;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.tool{position:relative;width:44px;height:42px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.tool:hover{background:var(--panel);color:var(--fg)}
.tool[aria-pressed=true]{background:var(--panel-2);border-color:var(--line-2);color:var(--sun)}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool .k{position:absolute;right:4px;bottom:2px;font:500 9px var(--f-mono);color:var(--faint)}
.rail .sep{height:1px;background:var(--line);margin:3px 6px;flex:none}
.view{grid-area:view;position:relative;background:#07090b;border-radius:6px;overflow:hidden;min-height:0;border:1px solid var(--line)}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#glc{pointer-events:none}
#ov{touch-action:none;cursor:default}
.hint{position:absolute;left:10px;top:10px;max-width:min(560px,calc(100% - 450px));display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:rgba(16,20,26,.8);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.07);border-radius:5px;padding:6px 10px;font-size:12px;color:var(--muted);pointer-events:none}
.hint b{color:var(--fg);font-weight:600}
.vbar{position:absolute;right:10px;top:10px;display:flex;gap:6px;align-items:center;z-index:2}
.vbar .seg{background:rgba(16,20,26,.82);backdrop-filter:blur(6px)}
.vbtn{display:flex;align-items:center;gap:6px;background:rgba(16,20,26,.82);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font:500 12px var(--f-ui);color:var(--fg);white-space:nowrap}
.vbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.vbtn:disabled{color:var(--faint);cursor:default}
#qFinal[aria-pressed=true]{background:var(--sun);color:#1b1408}
.shotpick{display:flex;gap:6px;align-items:center;flex:none}
.shotpick select{width:auto;background:var(--well);border-color:var(--line);font:500 12px var(--f-mono);padding:4px 6px}
.shotpick label{font:500 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.presets{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 2px}
.chip.pre{text-transform:none;letter-spacing:0;font-size:12px;padding:4px 9px}
.note.new{color:var(--muted)} .note.new b{color:var(--sun)}
.sec.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{border-color:var(--sun);box-shadow:0 0 0 1px var(--sun)}100%{border-color:var(--line);box-shadow:none}}
.conv i.fin{background:var(--sun)}
.navkeys{position:absolute;right:64px;bottom:10px;font:11px var(--f-mono);color:rgba(220,226,232,.55);background:rgba(16,20,26,.6);border-radius:4px;padding:3px 7px;pointer-events:none;text-align:right;line-height:1.5}
@media (prefers-reduced-motion:reduce){.sec.flash{animation:none}}
.hud{position:absolute;left:10px;bottom:10px;font:11px var(--f-mono);color:rgba(230,234,238,.78);background:rgba(16,20,26,.62);border-radius:4px;padding:3px 7px;font-variant-numeric:tabular-nums;pointer-events:none}
.conv{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.06);pointer-events:none}
.conv i{display:block;height:100%;width:0;background:var(--mist);transition:width .15s}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#222932 0%,#0b0d10 75%);z-index:4}
.loader .card{width:min(380px,80%);display:flex;flex-direction:column;gap:10px}
.loader .t{font:italic 28px var(--f-display)}
.loader .s{font:12px var(--f-mono);color:var(--muted);min-height:1.4em}
.loader .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mist),var(--sun));transition:width .2s}
.loader.err .s{color:var(--danger);white-space:pre-wrap;max-height:40vh;overflow:auto}
.drop{position:absolute;inset:10px;border:2px dashed var(--mist);border-radius:8px;display:grid;place-items:center;background:rgba(10,14,18,.75);z-index:3;font:500 15px var(--f-ui);color:var(--fg);pointer-events:none}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:6px 12px;font-size:12px;z-index:5;white-space:nowrap}
.tl{grid-area:tl;display:flex;align-items:center;gap:12px;min-width:0}
.play{width:34px;height:30px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line-2);display:grid;place-items:center;flex:none}
.play svg{width:14px;height:14px;fill:var(--fg)}
.frame{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;flex:none;width:86px}
.frame small{color:var(--faint);font-size:11px}
.tl input[type=range]{flex:1;min-width:60px}
.tl .meta{font:11px var(--f-mono);color:var(--faint);flex:none;white-space:nowrap}
.insp{grid-area:insp;overflow-y:auto;overflow-x:hidden;min-height:0;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;padding-bottom:4px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 12px}
.sec>summary{list-style:none;cursor:pointer;padding:10px 0;font:600 10.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg) translateY(-2px)}
.sec[open]>summary::after{transform:rotate(-135deg)}
.sec>summary .count{font:500 10.5px var(--f-mono);letter-spacing:0;color:var(--faint);margin-left:auto}
.sec>summary .count+*{margin-left:0}
.body{display:flex;flex-direction:column;gap:6px;padding-bottom:12px}
.sub-h{font:500 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 62px;align-items:center;gap:8px;min-height:24px}
.row label{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{font:11px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.wide{grid-template-columns:92px minmax(0,1fr)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--mist) var(--p),var(--line-2) var(--p))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--mist) var(--p),var(--line-2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);margin-top:-4.5px;border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--fg);border:2px solid var(--panel)}
.tl input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--sun) var(--p),var(--line-2) var(--p))}
.tl input[type=range]::-moz-range-track{background:linear-gradient(90deg,var(--sun) var(--p),var(--line-2) var(--p))}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 11px var(--f-ui);letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--line-2);background:transparent;color:var(--muted)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed=true]{color:#10161b;background:var(--mist);border-color:var(--mist)}
.vlist{display:flex;flex-direction:column;gap:2px}
.vrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto 24px 24px;align-items:center;gap:8px;padding:4px 4px 4px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.vrow:hover{background:var(--panel-2)}
.vrow.sel{background:var(--panel-2);border-color:var(--line-2)}
.vrow .sw{width:9px;height:9px;border-radius:50%}
.vrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .ty{font:10.5px var(--f-mono);color:var(--faint)}
.vrow.off .nm{color:var(--faint);text-decoration:line-through}
.ib{width:24px;height:22px;border:0;background:transparent;color:var(--muted);border-radius:3px;display:grid;place-items:center;padding:0}
.ib:hover{background:var(--line);color:var(--fg)}
.ib svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.empty{color:var(--muted);font-size:12.5px;line-height:1.5}
.kbd{font:500 10.5px var(--f-mono);background:var(--panel-2);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;color:var(--fg)}
.name-in{background:var(--well);border:1px solid var(--line);border-radius:4px;padding:4px 7px;width:100%;box-sizing:border-box;font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:4px 10px;font:500 12px var(--f-ui)}
.btn.danger{color:var(--danger)}
.btn.auto{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:6px 9px;flex:1 1 130px}
.btn.auto b{font-weight:600;font-size:12px}
.btn.auto span{font-size:11px;color:var(--muted);line-height:1.3}
.colorin{-webkit-appearance:none;appearance:none;width:36px;height:22px;border:1px solid var(--line-2);border-radius:4px;padding:0;background:none}
.colorin::-webkit-color-swatch-wrapper{padding:2px}.colorin::-webkit-color-swatch{border:0;border-radius:2px}
.windwrap{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center}
#windDial{width:76px;height:76px;touch-action:none;cursor:grab}
.note{font-size:11.5px;color:var(--faint);line-height:1.45}
.note b{color:var(--muted);font-weight:500}
.plate-meta{font:11px var(--f-mono);color:var(--muted);line-height:1.6;font-variant-numeric:tabular-nums}
.plate-meta .ok{color:#8fc79b}
.err{color:var(--danger);font-size:12px;line-height:1.45;white-space:pre-wrap}
select{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:3px 6px;font-size:12px;min-width:0;width:100%}
.modal{position:fixed;inset:0;background:rgba(6,8,10,.66);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mcard{width:min(880px,100%);max-height:calc(100% - 48px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mhead h2{margin:0;font:italic 400 24px var(--f-display)}
.mtabs{display:flex;gap:2px}
.mtabs button{background:transparent;border:0;padding:5px 10px;border-radius:4px;color:var(--muted);font-weight:500}
.mtabs button[aria-selected=true]{background:var(--panel-2);color:var(--fg)}
.mbody{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbody p{margin:0;max-width:70ch;color:var(--muted);line-height:1.55}
.mbody p b{color:var(--fg);font-weight:600}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.flow div{background:var(--well);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.flow h4{margin:0;font:600 10.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}
.flow span{font-size:12.5px;line-height:1.45}
pre.code{margin:0;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:12px;font:11.5px/1.5 var(--f-mono);color:#c9d3dc;overflow:auto;max-height:340px;white-space:pre}
.codehead{display:flex;align-items:center;gap:10px}
.codehead span{font:500 11px var(--f-mono);color:var(--faint)}
.codehead .btn{margin-left:auto}
.x{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
@media (max-width:860px){
  body{overflow:auto}
  #app{height:auto;display:flex;flex-direction:column;gap:8px;padding-block:6px 16px}
  .top{flex-wrap:wrap;gap:8px 10px}
  .aovs{order:5;width:100%}
  .rail{flex-direction:row;overflow-x:auto;padding:0}
  .rail .sep{width:1px;height:auto;margin:6px 2px}
  .view{height:58vh;min-height:300px;flex:none}
  .insp{overflow:visible}
  .flow{grid-template-columns:1fr}
  .brand .sub,.navkeys{display:none}
  .hint{top:auto;bottom:34px;max-width:calc(100% - 20px)}
  .vbar{flex-wrap:wrap;justify-content:flex-end;left:10px}
}
@media (prefers-reduced-motion:reduce){.conv i,.loader .bar i{transition:none}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand"><span class="word">Brume</span><span class="sub">fog layout from utility passes</span></div>
    <div class="shotpick"><label for="seqSel">Seq</label><select id="seqSel" aria-label="Sequence"><option>tst · Brume test shots</option></select><label for="shotSel">Shot</label><select id="shotSel" aria-label="Shot"></select></div>
    <div class="seg aovs" id="aovs" role="tablist" aria-label="View pass"></div>
    <div class="top-r">
      <button class="tbtn" id="fogBtn" aria-pressed="true" title="Toggle fog (V)">Fog on</button>
      <button class="tbtn accent" id="handoffBtn">Hand-off</button>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Tools"></nav>
  <section class="view" id="view">
    <canvas id="glc"></canvas>
    <canvas id="ov" aria-label="Viewport"></canvas>
    <div class="hint" id="hint"></div>
    <div class="vbar">
      <div class="seg" id="viewSeg" role="group" aria-label="Camera">
        <button id="vShot" aria-pressed="true" title="Look through the shot camera (C)">Shot cam</button>
        <button id="vLayout" aria-pressed="false" title="Free layout camera over the reconstructed set (C)">Layout</button>
      </div>
      <button class="vbtn" id="camReset" title="Reset the view to the shot camera"><svg viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.5-3.6"/><path d="M3 2.5v2.8h2.8"/></svg>Reset to shot cam</button>
      <div class="seg" role="group" aria-label="Render quality">
        <button id="qDraft" aria-pressed="true" title="Fast interactive fog (G)">Draft</button>
        <button id="qFinal" aria-pressed="false" title="Full resolution, every detail octave, keeps refining (G)">Final</button>
      </div>
    </div>
    <div class="navkeys" id="navkeys"></div>
    <div class="hud" id="hud">starting</div>
    <div class="conv"><i id="convBar"></i></div>
    <div class="drop" id="drop" hidden>Drop EXR passes to load them</div>
    <div class="loader" id="loader"><div class="card"><div class="t">Brume</div><div class="s" id="loadMsg">Starting the GPU</div><div class="bar"><i id="loadBar"></i></div></div></div>
    <div class="toast" id="toast" hidden></div>
  </section>
  <footer class="tl">
    <button class="play" id="playBtn" aria-label="Play"><svg viewBox="0 0 14 14" id="playIco"><path d="M3 1.5v11l9-5.5z"/></svg></button>
    <div class="frame" id="frameOut">1001 <small>/1240</small></div>
    <input type="range" id="scrub" min="1001" max="1240" step="1" value="1001" aria-label="Frame">
    <div class="meta">24 fps · 10 s loop</div>
  </footer>
  <aside class="insp" id="insp">
    <details class="sec" open><summary>Fog elements <span class="count" id="elCount"></span></summary><div class="body"><div class="vlist" id="elList"></div><div class="btns" style="margin-top:4px"><button class="btn" id="settleAll" title="Settle every element: valley fog fills down to the ground, ground fog drains into hollows, banks and low cloud come down to the terrain">Settle all</button></div><div class="sub-h">Auto-place from the passes</div><div class="btns" id="autoBtns"></div></div></details>
    <details class="sec" id="secCtx" open><summary id="ctxTitle">Selected</summary><div class="body" id="ctxBody"></div></details>
    <details class="sec"><summary>Look &amp; motion</summary><div class="body" id="lookBody"></div></details>
    <details class="sec"><summary>Light</summary><div class="body" id="lightBody"></div></details>
    <details class="sec"><summary>View &amp; render</summary><div class="body" id="rendBody"></div></details>
    <details class="sec" id="secPlate"><summary>Plate</summary><div class="body" id="plateBody"></div></details>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead"><h2 id="mTitle">Hand-off</h2>
      <div class="mtabs" id="mtabs" role="tablist">
        <button role="tab" data-t="concept" aria-selected="true">How it plugs in</button>
        <button role="tab" data-t="nuke" aria-selected="false">Nuke</button>
        <button role="tab" data-t="houdini" aria-selected="false">Houdini</button>
      </div>
      <button class="x" id="mClose" aria-label="Close">×</button>
    </div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   Brume — fog layout driven by utility passes (P, N, alpha, colour).
   The plate's P pass gives exact per-pixel holdouts; the same pass is
   rebuilt into a rough mesh / point cloud for free-camera layout, and
   analysed into a ground surface so placed fog behaves like real fog.
   ===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

$('#shotSel').onchange=ev=>{ loadSample(ev.target.value); };
let loadingScene=false;
async function loadSample(kind=S.shot){ if(loadingScene) return; loadingScene=true; ready=false; drag=null;
  try{ S.shot=kind; $('#shotSel').value=kind; const sh=SHOTS.find(s=>s.id===kind); showLoader('Loading '+sh.code+' · '+sh.name,0.05);
    const pl=await renderSampleFrame(kind,(t,x)=>showLoader(t,0.05+0.55*x)); await ingest(pl,(t,x)=>showLoader(t,0.6+0.35*x)); afterIngest(kind); hideLoader(); ready=true; }
  catch(e){ console.error(e); fail(e.message); } loadingScene=false; }
function afterIngest(kind){
  newTemplates(); buildPlate(); buildGlobal(); buildList(); syncViewSeg(); undoStack.length=0;
  if(kind==='village'){ runAutoQuiet('pool'); runAutoQuiet('rising'); select(-1); }
  else if(kind==='street'){ streetDefaults(); select(-1); }
  buildCtx(); pushUndo(); dirty.sky=true; dirty.shadow=true; dirty.display=true; markEl();
}
function runAutoQuiet(k){ const e=AUTO[k](); if(e) S.els.push(e); return e; }
['dragenter','dragover'].forEach(t=>$('#view').addEventListener(t,ev=>{ ev.preventDefault(); $('#drop').hidden=false; }));
['dragleave','drop'].forEach(t=>$('#view').addEventListener(t,ev=>{ ev.preventDefault(); $('#drop').hidden=true; }));
$('#view').addEventListener('drop',ev=>{ const f=[...ev.dataTransfer.files].filter(f=>/\.exr$/i.test(f.name)); if(f.length) readFiles(f); else toast('Drop .exr files'); });

/* timeline */
function togglePlay(){ S.playing=!S.playing; $('#playIco').innerHTML=S.playing?'<path d="M3 1.5h3v11H3zM8 1.5h3v11H8z"/>':'<path d="M3 1.5v11l9-5.5z"/>'; $('#playBtn').setAttribute('aria-label',S.playing?'Pause':'Play'); resetAccum(); }
$('#playBtn').onclick=togglePlay;
function syncTimeline(){ const f=1001+Math.floor(S.time*24); const sc=$('#scrub'); sc.value=f; sc.style.setProperty('--p',((f-1001)/239*100)+'%'); $('#frameOut').innerHTML=`${f} <small>/1240</small>`; }
$('#scrub').addEventListener('input',ev=>{ S.time=(+ev.target.value-1001)/24; syncTimeline(); poke(); });
function updateHud(V,vw,vh){ const fin=S.quality==='final', tgt=fin?S.finalFrames:S.frames; const conv=Math.min(1,frames/tgt); $('#convBar').style.width=(S.playing?100:conv*100)+'%'; $('#convBar').classList.toggle('fin',fin);
  const st=!ELU.n?'no fog elements':S.playing?'playing':frames>=tgt?'refined':interacting?'interactive':(fin?'final '+frames+'/'+tgt:'refining');
  $('#hud').textContent=`${V.layout?'layout':'shot cam'} · ${fin?'final':'draft'} ${vw}×${vh} · ${ftAvg.toFixed(0)} ms · ${st}`; syncViewSeg(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }
function showLoader(msg,p){ const l=$('#loader'); l.hidden=false; l.classList.remove('err'); $('#loadMsg').textContent=msg; if(p!=null) $('#loadBar').style.width=(p*100).toFixed(1)+'%'; }
function hideLoader(){ $('#loader').hidden=true; }
function fail(msg){ const l=$('#loader'); l.hidden=false; l.classList.add('err'); $('#loadMsg').textContent=msg; ready=false; }

/* =====================================================================
   HAND-OFF
   ===================================================================== */
let mTab='concept';
const r2=x=>Math.round(x*1000)/1000;
function setJSON(){ const u=PL.units||1; return {plate:PL.name,camera:PL.camSrc,units_in_file:u===1?'m':u===0.01?'cm':u,units_here:'m',frames:[1001,1240],fps:24,
  sun:{elevation:r2(S.sun.el),azimuth:r2(S.sun.az)},wind:{toward_deg:r2(S.wind.dir),speed_mps:r2(S.wind.speed)},look:{base_scale_m:r2(S.look.noise),droplet_um:r2(S.look.drop),inner_glow:r2(S.look.ms),evolve:r2(S.look.evolve)},
  elements:S.els.map(e=>({name:e.name,type:e.type,on:e.on,center:e.c.map(r2),radius:e.r.map(r2),yaw_deg:r2(-e.yaw/D2R),visibility_m:r2(e.vis),level:e.type==='pool'||e.type==='cloud'?r2(e.level):undefined,
    style:{preset:e.preset||undefined,structure_m:r2(S.look.noise*e.struct),billow:r2(e.billow),detail:r2(e.detail),breakup:r2(e.breakup),windswept:r2(e.swept),turbulence:r2(e.turb),edge_softness:r2(e.edge),seed:e.seed},
    feather:r2(e.feather),terrain_follow:r2(e.terrain),burn_off:r2(e.burn||0),drift:e.type==='bank'?r2(e.aux):undefined,source:e.type==='rising'?(e.aux?'canopy':'ground'):undefined,rise_mps:e.type==='rising'?r2(e.rise):undefined,
    mask:e.mask>=0?{offset:e.mo.map(r2),pivot:e.mc.map(r2),scale:r2(e.ms),sculpted:(e.hmax||1)>1.01}:undefined}))}; }
function nukeSnippet(){ const j=JSON.stringify(setJSON()).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\[/g,'\\[').replace(/\]/g,'\\]').replace(/\$/g,'\\$');
  return `set cut_paste_input [stack 0]
push $cut_paste_input
Group {
 name Brume_FogSet1
 tile_color 0xefb24dff
 label "${S.els.length} fog elements"
 addUserKnob {20 brume l Brume}
 addUserKnob {26 about l "" +STARTLINE T "Fog set from the Brume prototype. Feed it the utility pass (P, N, alpha) and the shot camera."}
 addUserKnob {41 in_P l "P layer" T pos}
 addUserKnob {7 wind_speed l "Wind (m/s)" R 0 20}
 wind_speed ${S.wind.speed.toFixed(2)}
 addUserKnob {7 wind_dir l "Wind toward" R 0 360}
 wind_dir ${S.wind.dir.toFixed(1)}
 addUserKnob {7 sun_elevation l "Sun elevation" R -10 90}
 sun_elevation ${S.sun.el.toFixed(2)}
 addUserKnob {7 sun_azimuth l "Sun azimuth" R -180 180}
 sun_azimuth ${S.sun.az.toFixed(2)}
 addUserKnob {1 fog_set l "Fog set (JSON)"}
 fog_set "${j}"
}
 Input {
  inputs 0
  name utility
  label "P / N / alpha"
 }
 Output {
  name Output1
 }
end_group
`; }
function vexSnippet(){ const L=[`// Brume fog set -> density. Volume Wrangle on a fog-sized volume (metres).`,`// Input 2: terrain heightfield (height layer). Elements below are baked from the prototype.`,`float g = volumesample(1, "height", set(@P.x, 0, @P.z));`,`float h = @P.y - g;`,`float nz = anoise(@P / ${S.look.noise.toFixed(2)} - set(${windDir().map(v=>(v*S.wind.speed).toFixed(3)).join(', ')}) * @Time);`,`// Billow / wisp detail, breakup and windswept per element are in fog_set.json (style); the real tool runs the same octave stack in VEX.`,`float d = 0;`];
  S.els.filter(e=>e.on).forEach(e=>{ const s=vis2s(e.vis).toFixed(5), c=e.c.map(v=>v.toFixed(2)).join(', ');
    L.push(`// ${e.name} (${e.type})`);
    { L.push(`{ vector2 l = set(@P.x - ${e.c[0].toFixed(2)}, @P.z - ${e.c[2].toFixed(2)}); float fp = 1 - smooth(1 - ${e.feather.toFixed(2)}, 1, length(set(l.x / ${e.r[0].toFixed(2)}, l.y / ${e.r[2].toFixed(2)})));`);
      const v= e.type==='ground'? `1 - smooth(${(e.r[1]*0.12).toFixed(3)}, ${e.r[1].toFixed(3)}, h)` : e.type==='pool'? `smooth(${e.level.toFixed(2)}, ${(e.level-e.r[1]).toFixed(2)}, @P.y)` : e.type==='mist'? `exp(-max(h, 0) / ${e.r[1].toFixed(2)})` : e.type==='bank'? `smooth(${(e.c[1]+e.r[1]).toFixed(2)}, ${(e.c[1]+e.r[1]*0.6).toFixed(2)}, @P.y)` : e.type==='cloud'? `smooth(${e.level.toFixed(2)}, ${(e.level+e.r[1]*0.15).toFixed(2)}, @P.y) * smooth(${(e.level+e.r[1]).toFixed(2)}, ${(e.level+e.r[1]*0.7).toFixed(2)}, @P.y) * (0.3 + 0.7 * clamp((@P.y - ${e.level.toFixed(2)}) / ${e.r[1].toFixed(2)}, 0, 1))` : e.type==='rising'? `exp(-max(h, 0) / ${e.r[1].toFixed(2)}) * smooth(0.6, 0.9, anoise(@P * set(1, 0.4, 1) / ${(S.look.noise*e.struct).toFixed(2)} - set(0, ${e.rise.toFixed(2)}, 0) * @Time))` : `1 - smooth(${(e.r[1]*0.4).toFixed(2)}, ${e.r[1].toFixed(2)}, h)`;
      L.push(`  d += ${s} * fp * (${v}) * (h > 0); }`); } });
  L.push(`f@density = d;  // extinction per metre; render with albedo ~0.98 and a cloud-droplet phase (~${S.look.drop.toFixed(0)} µm)`); return L.join('\n'); }
function copyBtn(btn,text){ btn.onclick=async()=>{ try{ await navigator.clipboard.writeText(text); btn.textContent='Copied'; }catch(_){ const pre=btn.closest('.codewrap').querySelector('pre'); const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent='Selected · press Ctrl C'; } setTimeout(()=>btn.textContent='Copy',1600); }; }
function buildModal(){ document.querySelectorAll('#mtabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===mTab)); const m=$('#mBody'); m.innerHTML='';
  if(mTab==='concept'){ m.innerHTML=`<p>Brume reads the <b>utility pass we already render</b> for every shot. P gives each pixel its exact place in the world, so the fog is raymarched straight against the frame with per-pixel holdouts and no sphere edges. The same P pass is rebuilt into a rough set you can orbit, so placing fog in depth is as easy as placing a light.</p>
    <div class="flow"><div><h4>1 · Utility pass in</h4><span>P, N and alpha from the render, plus surface colour or beauty for reference. Camera from the EXR metadata or solved from P.</span></div>
    <div><h4>2 · Place and direct</h4><span>Ground fog, valley fog, low cloud, banks, rising mist and mist, each with its own look: billows or wisps, breakup, windswept streaks. Move, size, rotate, paint and sculpt them in the view. The ground, hollows and walls are read from the passes so fog settles where real fog would. Paint to add or clear.</span></div>
    <div><h4>3 · Out to comp or 3D</h4><span><b>Nuke:</b> the same raymarch as a GPU node fed by P, so the element and its holdouts update with the comp. <b>Houdini:</b> the fog set baked to VDB from the same density model.</span></div></div>
    <p><b>Why it is fast:</b> nothing is path traced from scratch. Light comes from a sun and sky with shadows cast by the reconstructed set, multiple scattering is approximated in closed form, and the march only runs where a fog element actually is. Moving things drops the fog resolution for a moment, then it refines.</p>
    <p><b>How the fog behaves:</b> the passes are read for ground height, hollows, cold-air drainage lines, walls, tree canopy, slope direction and which ground sits in the sun's shadow. Ground fog is densest at the ground under a flat top and collects in hollows and drainage lines. Valley fog fills basins under the inversion and gets denser towards its top, with waves when wind runs over it. Low cloud sits at a condensation-level base that drops on windward slopes and clears in the lee, with scud underneath. Rising mist comes off wet canopy in wisps and puffs. Burn-off thins fog first where it is thin, sunlit or warm and lets it linger in shade. Light scatters with a measured cloud-droplet phase function, so backlit fog glows the way real fog does.</p>`; }
  else if(mTab==='nuke'){ m.innerHTML=`<p>Paste into the Node Graph. It creates a stub group that carries the fog set, sun and wind as knobs, ready for a real Brume node to read alongside the utility pass.</p><div class="codewrap"><div class="codehead"><span>Nuke · paste into Node Graph</span><button class="btn">Copy</button></div><pre class="code"></pre></div>`; const t=nukeSnippet(); m.querySelector('pre').textContent=t; copyBtn(m.querySelector('.btn'),t); }
  else { m.innerHTML=`<p>A Volume Wrangle that rebuilds the shape-based elements with Houdini noise, for baking to VDB and referencing through USD. Painted and auto masks would travel as a heightfield mask in the real tool.</p><div class="codewrap"><div class="codehead"><span>Houdini · Volume Wrangle (VEX)</span><button class="btn">Copy</button></div><pre class="code"></pre></div><div class="codewrap"><div class="codehead"><span>fog_set.json</span><button class="btn">Copy</button></div><pre class="code"></pre></div>`;
    const v=vexSnippet(), j=JSON.stringify(setJSON(),null,2); const ps=m.querySelectorAll('pre'), bs=m.querySelectorAll('.btn'); ps[0].textContent=v; ps[1].textContent=j; copyBtn(bs[0],v); copyBtn(bs[1],j); } }
function openModal(){ if(!PL) return; $('#modal').hidden=false; buildModal(); $('#mClose').focus(); }
function closeModal(){ $('#modal').hidden=true; }
$('#handoffBtn').onclick=openModal; $('#mClose').onclick=closeModal; $('#modal').addEventListener('click',ev=>{ if(ev.target.id==='modal') closeModal(); });
document.querySelectorAll('#mtabs button').forEach(b=>b.onclick=()=>{ mTab=b.dataset.t; buildModal(); });

/* =====================================================================
   BOOT
   ===================================================================== */
let ready=false;
function initGL(){
  gl=glc.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,premultipliedAlpha:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
  if(!gl){ fail('WebGL 2 is not available in this browser. Brume needs a GPU-enabled Chrome, Edge, Firefox or Safari.'); return false; }
  X.cbf=gl.getExtension('EXT_color_buffer_float'); X.fl=gl.getExtension('OES_texture_float_linear'); X.par=gl.getExtension('KHR_parallel_shader_compile');
  if(!X.cbf){ fail('This GPU cannot render to floating-point targets, which Brume needs.'); return false; }
  VA.fs=gl.createVertexArray(); gl.bindVertexArray(VA.fs); const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0); gl.bindVertexArray(null);
  mkProg('noise',VS_FS,FS_NOISE); mkProg('sky',VS_FS,FS_SKY); mkProg('march',VS_FS,FS_MARCH); mkProg('disp',VS_FS,FS_DISP);
  mkProg('lRecon',VS_RECON,FS_RECON); mkProg('lProxy',VS_PROXY,FS_PROXY); mkProg('dRecon',VS_RECON,FS_EMPTY); mkProg('dProxy',VS_PROXY,FS_EMPTY);
  mkProg('sTerrain',VS_ST,FS_ST); mkProg('sBld',VS_SB,FS_SB); mkProg('sTree',VS_STR,FS_STR); mkProg('sWater',VS_SW,FS_SW); mkProg('sSky',VS_FS,FS_SSKY); mkProg('sD',VS_SD,FS_EMPTY); mkProg('sTreeD',VS_STR.replace('out vec3 vP; out vec3 vN; out vec3 vC; out float vPart; out float vH;','out vec3 vP; out vec3 vN; out vec3 vC; out float vPart; out float vH;'),FS_EMPTY); mkProg('sDown',VS_FS,FS_SDOWN);
  T.noise=tex3D(128,128,128,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,gl.LINEAR,gl.REPEAT); T.detail=tex3D(128,128,128,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,gl.LINEAR,gl.REPEAT);
  T.sky=tex2D(256,128,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,gl.LINEAR,gl.CLAMP_TO_EDGE); gl.bindTexture(gl.TEXTURE_2D,T.sky); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  F.sky=mkFBO([T.sky]); drawBufs(1); F.layer=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return true;
}
async function boot(){
  buildRail(); buildHint(); buildAovs(); buildShots(); syncViewSeg();
  if(!initGL()) return;
  const t0=performance.now();
  while(true){ const done=Object.values(PR).filter(progDone).length, n=Object.keys(PR).length; showLoader(`Compiling shaders ${done}/${n} · ${((performance.now()-t0)/1000).toFixed(1)} s`,0.02+0.15*done/n); if(done===n) break; await new Promise(r=>setTimeout(r,60)); }
  try{ for(const p of Object.values(PR)) progCheck(p); }catch(e){ fail(e.message); return; }
  const pr=use('noise'); gl.bindFramebuffer(gl.FRAMEBUFFER,F.layer); drawBufs(1);
  for(const [tex,N,mode,p0,p1] of [[T.noise,128,0,0.17,0.08],[T.detail,128,1,0.25,0.06]]){ gl.viewport(0,0,N,N); u1f(pr,'uN',N); u1i(pr,'uMode',mode);
    for(let z=0;z<N;z++){ gl.framebufferTextureLayer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,tex,0,z); u1f(pr,'uZ',(z+0.5)/N); fullscreen(); if(z%16===15){ showLoader('Building the noise volumes',p0+p1*z/N); await yieldUI(); } } }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  for(const tex of [T.noise,T.detail]){ gl.bindTexture(gl.TEXTURE_3D,tex); gl.generateMipmap(gl.TEXTURE_3D); gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); }
  updateSunCPU(); renderSkyTex();
  resize(); new ResizeObserver(()=>{ resize(); }).observe($('#view'));
  buildAuto();
  await loadSample(S.shot);
  ready=true; requestAnimationFrame(frame);
}
glc.addEventListener('webglcontextlost',ev=>{ ev.preventDefault(); ready=false; showLoader('The GPU reset. Reload the page to continue.',0); });
boot();
